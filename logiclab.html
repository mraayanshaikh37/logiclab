const CommsLab = (() => {
  let cCanvas, cCtx, animId=null, tOff=0;

  function init() {
    const p = document.getElementById('panel-comms');
    p.innerHTML = `
      <div class="sec">Communication Systems — Modulation Lab</div>
      <div class="hint"><b>What this shows</b><br>A message (baseband) signal modulated onto a carrier.
        Switch between <b>AM</b> (amplitude varies) and <b>FM</b> (frequency varies) and watch the carrier respond.</div>

      <div class="card" style="margin-bottom:16px">
        <div class="row">
          <div class="col">
            <label>Modulation Type</label>
            <select id="cm-type" onchange="CommsLab.draw()">
              <option value="am">AM — Amplitude Modulation</option>
              <option value="fm">FM — Frequency Modulation</option>
            </select>
          </div>
          <div class="col">
            <label>Carrier Freq (Hz)</label>
            <input type="number" id="cm-fc" value="12" min="2" max="30" step="1" oninput="CommsLab.draw()">
          </div>
          <div class="col">
            <label>Message Freq (Hz)</label>
            <input type="number" id="cm-fm" value="1" min="0.2" max="5" step="0.1" oninput="CommsLab.draw()">
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label id="cm-idx-label">Modulation Index (m)</label>
            <input type="number" id="cm-idx" value="0.7" min="0" max="1" step="0.05" oninput="CommsLab.draw()">
          </div>
          <div class="col" style="flex:2">
            <label>&nbsp;</label>
            <div class="row" style="margin:0">
              <button class="btn btn-g" onclick="CommsLab.toggleAnim()" id="cm-anim-btn">▶ Animate</button>
              <button class="btn btn-p" onclick="CommsLab.explain()">✨ AI Explain</button>
            </div>
          </div>
        </div>
        <canvas id="commscanvas" style="margin-top:12px"></canvas>
        <div id="cm-out" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px;line-height:1.8"></div>
      </div>
      <div id="cm-ai" class="card" style="display:none;font-size:12px;line-height:1.9"></div>
    `;
    cCanvas = document.getElementById('commscanvas');
    cCtx = cCanvas.getContext('2d');
    cCanvas.width = cCanvas.offsetWidth;
    cCanvas.height = 260;
    draw();
  }

  function onShow() {
    if (cCanvas) { cCanvas.width = cCanvas.offsetWidth; draw(); }
  }

  function plot(ctx2d, W, rowH, yCenter, fn, color, label) {
    ctx2d.strokeStyle = 'rgba(255,255,255,0.08)'; ctx2d.lineWidth = 1;
    ctx2d.beginPath(); ctx2d.moveTo(0, yCenter); ctx2d.lineTo(W, yCenter); ctx2d.stroke();
    ctx2d.fillStyle = color; ctx2d.font = '10px JetBrains Mono';
    ctx2d.fillText(label, 6, yCenter - rowH/2 + 12);
    ctx2d.strokeStyle = color; ctx2d.lineWidth = 1.8;
    ctx2d.beginPath();
    for (let px = 0; px < W; px++) {
      const tv = px / W * 4 * Math.PI + tOff;
      const v = fn(tv);
      const y = yCenter - v * (rowH * 0.4);
      px === 0 ? ctx2d.moveTo(px, y) : ctx2d.lineTo(px, y);
    }
    ctx2d.stroke();
  }

  function draw() {
    if (!cCanvas || !cCtx) return;
    const type = document.getElementById('cm-type')?.value || 'am';
    const fc = parseFloat(document.getElementById('cm-fc')?.value || 12);
    const fm = parseFloat(document.getElementById('cm-fm')?.value || 1);
    const m = parseFloat(document.getElementById('cm-idx')?.value || 0.7);
    document.getElementById('cm-idx-label').textContent = type === 'am'
      ? 'Modulation Index (m)' : 'Frequency Deviation Index (β)';

    const W = cCanvas.width, H = cCanvas.height;
    const rowH = H / 3;
    cCtx.clearRect(0, 0, W, H);

    const msg = tv => Math.sin(fm * tv);
    plot(cCtx, W, rowH, rowH * 0.5, msg, '#3b82f6', 'Message m(t)');

    const carrier = tv => Math.sin(fc * tv);
    plot(cCtx, W, rowH, rowH * 1.5, carrier, '#6b6b80', 'Carrier c(t)');

    let modFn, mLabel;
    if (type === 'am') {
      modFn = tv => (1 + m * msg(tv)) * Math.sin(fc * tv);
      mLabel = 'AM signal s(t) = [1 + m·m(t)]·cos(2πfc·t)';
    } else {
      modFn = tv => Math.sin(fc * tv + m * 5 * Math.sin(fm * tv));
      mLabel = 'FM signal s(t) = cos(2πfc·t + β·sin(2πfm·t))';
    }
    plot(cCtx, W, rowH, rowH * 2.5, modFn, '#00ff9d', mLabel);

    const bw = type === 'am' ? 2 * fm : 2 * (m * 5 + 1) * fm;
    document.getElementById('cm-out').innerHTML =
      `Carrier: <span class="eq" style="color:var(--accent)">${fc} Hz</span> &nbsp;|&nbsp; ` +
      `Message: <span class="eq" style="color:var(--accent)">${fm} Hz</span> &nbsp;|&nbsp; ` +
      `Approx. bandwidth: <span class="eq" style="color:var(--accent)">${bw.toFixed(2)} Hz</span>` +
      (type === 'fm' ? ' &nbsp;(Carson\'s rule estimate)' : '');
  }

  function toggleAnim() {
    const btn = document.getElementById('cm-anim-btn');
    if (animId) { cancelAnimationFrame(animId); animId = null; btn.textContent = '▶ Animate'; return; }
    btn.textContent = '⏸ Stop';
    const step = () => { tOff += 0.05; draw(); animId = requestAnimationFrame(step); };
    step();
  }

  async function explain() {
    const type = document.getElementById('cm-type')?.value || 'am';
    const fc = document.getElementById('cm-fc')?.value || 12;
    const fm = document.getElementById('cm-fm')?.value || 1;
    const m = document.getElementById('cm-idx')?.value || 0.7;
    const aiEl = document.getElementById('cm-ai');
    aiEl.style.display = 'block';
    await askAI(
      `Explain ${type.toUpperCase()} (${type==='am'?'Amplitude':'Frequency'} Modulation) to an ECE student. ` +
      `Given carrier freq=${fc}Hz, message freq=${fm}Hz, index=${m}:\n` +
      `1. What ${type.toUpperCase()} is and how it works\n2. What the modulation index/deviation controls\n` +
      `3. Bandwidth requirements (${type==='am'?'2×fm':"Carson's rule"})\n4. One real-world use case\nBe clear and concise.`,
      aiEl
    );
  }

  return { init, onShow, draw, toggleAnim, explain };
})();

/* ══════════════════════════════════════
   CONTROL SYSTEMS
══════════════════════════════════════ */
const ControlLab = (() => {
  let stepCanvas, stepCtx, bodeCanvas, bodeCtx;

  function init() {
    const p = document.getElementById('panel-control');
    p.innerHTML = `
      <div class="sec">Control Systems</div>

      <div class="card" style="margin-bottom:16px">
        <h4>Second-Order Step Response</h4>
        <div class="row">
          <div class="col"><label>Natural Freq ωn (rad/s)</label><input type="number" id="cs-wn" value="4" min="0.5" max="20" step="0.1" oninput="ControlLab.drawStep()"></div>
          <div class="col"><label>Damping Ratio ζ</label><input type="number" id="cs-zeta" value="0.4" min="0" max="2" step="0.05" oninput="ControlLab.drawStep()"></div>
        </div>
        <canvas id="stepcanvas" style="margin-top:12px"></canvas>
        <div id="cs-step-out" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px;line-height:1.8"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="ControlLab.explainStep()">✨ AI Explain</button>
        <div id="cs-step-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>

      <div class="card">
        <h4>Bode Plot — G(s) = ωn² / (s² + 2ζωn·s + ωn²)</h4>
        <canvas id="bodecanvas" style="margin-top:4px"></canvas>
        <div id="cs-bode-out" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="ControlLab.explainBode()">✨ AI Explain</button>
        <div id="cs-bode-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>
    `;
    stepCanvas = document.getElementById('stepcanvas'); stepCtx = stepCanvas.getContext('2d');
    stepCanvas.width = stepCanvas.offsetWidth; stepCanvas.height = 220;
    bodeCanvas = document.getElementById('bodecanvas'); bodeCtx = bodeCanvas.getContext('2d');
    bodeCanvas.width = bodeCanvas.offsetWidth; bodeCanvas.height = 260;
    drawStep(); drawBode();
  }

  function onShow() {
    if (stepCanvas) { stepCanvas.width = stepCanvas.offsetWidth; drawStep(); }
    if (bodeCanvas) { bodeCanvas.width = bodeCanvas.offsetWidth; drawBode(); }
  }

  function stepResponse(t, wn, zeta) {
    if (zeta < 1) {
      const wd = wn * Math.sqrt(1 - zeta * zeta);
      const phi = Math.acos(zeta);
      return 1 - (Math.exp(-zeta * wn * t) / Math.sqrt(1 - zeta * zeta)) * Math.sin(wd * t + phi);
    } else if (Math.abs(zeta - 1) < 1e-6) {
      return 1 - Math.exp(-wn * t) * (1 + wn * t);
    } else {
      const r1 = -wn * (zeta - Math.sqrt(zeta*zeta - 1));
      const r2 = -wn * (zeta + Math.sqrt(zeta*zeta - 1));
      const A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - A * Math.exp(r1 * t) - B * Math.exp(r2 * t);
    }
  }

  function drawStep() {
    if (!stepCanvas) return;
    const wn = +document.getElementById('cs-wn').value;
    const zeta = +document.getElementById('cs-zeta').value;
    const W = stepCanvas.width, H = stepCanvas.height;
    stepCtx.clearRect(0, 0, W, H);
    const ox = 40, oy = H - 26, pw = W - 56, ph = H - 46;
    const tMax = 10 / wn * (zeta < 0.3 ? 3 : 1.6) + 1;

    stepCtx.strokeStyle = 'rgba(255,255,255,0.12)'; stepCtx.lineWidth = 1;
    stepCtx.beginPath(); stepCtx.moveTo(ox, oy); stepCtx.lineTo(ox + pw, oy); stepCtx.stroke();
    stepCtx.beginPath(); stepCtx.moveTo(ox, oy); stepCtx.lineTo(ox, oy - ph); stepCtx.stroke();
    // reference line at c=1
    stepCtx.strokeStyle = 'rgba(255,255,255,0.15)'; stepCtx.setLineDash([4,4]);
    stepCtx.beginPath(); stepCtx.moveTo(ox, oy - ph*0.6); stepCtx.lineTo(ox+pw, oy - ph*0.6); stepCtx.stroke();
    stepCtx.setLineDash([]);
    stepCtx.fillStyle = '#6b6b80'; stepCtx.font = '10px JetBrains Mono';
    stepCtx.fillText('t (s)', ox + pw - 24, oy + 18); stepCtx.fillText('c(t)', ox - 30, oy - ph - 4);

    let maxC = 1;
    const pts = [];
    for (let i = 0; i <= pw; i++) {
      const t = (i / pw) * tMax;
      const c = stepResponse(t, wn, zeta);
      pts.push(c); if (c > maxC) maxC = c;
    }
    const scale = 0.6 / maxC; // keep c=1 line at 0.6*ph
    stepCtx.strokeStyle = '#00ff9d'; stepCtx.lineWidth = 2; stepCtx.beginPath();
    pts.forEach((c, i) => {
      const y = oy - c * scale * ph;
      i === 0 ? stepCtx.moveTo(ox + i, y) : stepCtx.lineTo(ox + i, y);
    });
    stepCtx.stroke();

    let overshoot = 0, Mp = 0;
    if (zeta < 1) { Mp = Math.exp(-Math.PI * zeta / Math.sqrt(1 - zeta*zeta)); overshoot = Mp * 100; }
    const ts = 4 / (zeta * wn);
    const tr = zeta < 1 ? (1.8 / wn) : (2.2 / wn);
    document.getElementById('cs-step-out').innerHTML =
      `Peak overshoot ≈ <span class="eq" style="color:var(--accent)">${zeta<1?overshoot.toFixed(1)+'%':'0% (no overshoot)'}</span> &nbsp;|&nbsp; ` +
      `Settling time (2%) ≈ <span class="eq" style="color:var(--accent)">${ts.toFixed(2)} s</span> &nbsp;|&nbsp; ` +
      `Rise time ≈ <span class="eq" style="color:var(--accent)">${tr.toFixed(2)} s</span><br>` +
      `Response type: <span class="eq" style="color:var(--accent)">${zeta<1?'Underdamped':(Math.abs(zeta-1)<1e-6?'Critically damped':'Overdamped')}</span>`;
  }

  function drawBode() {
    if (!bodeCanvas) return;
    const wn = +document.getElementById('cs-wn').value;
    const zeta = +document.getElementById('cs-zeta').value;
    const W = bodeCanvas.width, H = bodeCanvas.height;
    bodeCtx.clearRect(0, 0, W, H);
    const rowH = H / 2;
    const ox = 44, pw = W - 60;
    const fMin = wn / 100, fMax = wn * 100;

    function axis(yCenter, label, unit) {
      bodeCtx.strokeStyle = 'rgba(255,255,255,0.1)'; bodeCtx.lineWidth = 1;
      bodeCtx.beginPath(); bodeCtx.moveTo(ox, yCenter); bodeCtx.lineTo(ox + pw, yCenter); bodeCtx.stroke();
      bodeCtx.fillStyle = '#6b6b80'; bodeCtx.font = '10px JetBrains Mono';
      bodeCtx.fillText(label, 4, yCenter - rowH/2 + 12);
    }
    axis(rowH * 0.5, 'Magnitude (dB)');
    axis(rowH * 1.5, 'Phase (deg)');

    let magPts = [], phasePts = [], maxMag = -1e9, minMag = 1e9;
    for (let i = 0; i <= pw; i++) {
      const logw = Math.log10(fMin) + (i / pw) * (Math.log10(fMax) - Math.log10(fMin));
      const w = Math.pow(10, logw);
      const denomRe = wn*wn - w*w, denomIm = 2*zeta*wn*w;
      const magLin = (wn*wn) / Math.sqrt(denomRe*denomRe + denomIm*denomIm);
      const magDb = 20 * Math.log10(magLin);
      const phase = -Math.atan2(denomIm, denomRe) * 180 / Math.PI;
      magPts.push(magDb); phasePts.push(phase);
      if (magDb > maxMag) maxMag = magDb; if (magDb < minMag) minMag = magDb;
    }
    const magRange = Math.max(maxMag - minMag, 10);
    bodeCtx.strokeStyle = '#00ff9d'; bodeCtx.lineWidth = 2; bodeCtx.beginPath();
    magPts.forEach((m, i) => {
      const y = rowH * 0.5 + rowH*0.35 - ((m - minMag) / magRange - 0.5) * rowH * 0.7;
      i === 0 ? bodeCtx.moveTo(ox + i, y) : bodeCtx.lineTo(ox + i, y);
    });
    bodeCtx.stroke();
    bodeCtx.strokeStyle = '#3b82f6'; bodeCtx.lineWidth = 2; bodeCtx.beginPath();
    phasePts.forEach((ph, i) => {
      const y = rowH * 1.5 - (ph / 180) * (rowH * 0.45);
      i === 0 ? bodeCtx.moveTo(ox + i, y) : bodeCtx.lineTo(ox + i, y);
    });
    bodeCtx.stroke();

    const peakDb = zeta < 0.707 ? 20*Math.log10(1/(2*zeta*Math.sqrt(1-zeta*zeta))) : 0;
    document.getElementById('cs-bode-out').innerHTML =
      `Resonant peak: <span class="eq" style="color:var(--accent)">${zeta<0.707?peakDb.toFixed(1)+' dB at ωr≈'+(wn*Math.sqrt(1-2*zeta*zeta)).toFixed(2)+' rad/s':'none (ζ ≥ 0.707)'}</span> &nbsp;|&nbsp; ` +
      `Bandwidth ≈ <span class="eq" style="color:var(--accent)">${(wn*Math.sqrt(1-2*zeta*zeta+Math.sqrt(4*zeta*zeta*zeta*zeta-4*zeta*zeta+2))).toFixed(2)} rad/s</span>`;
  }

  async function explainStep() {
    const aiEl = document.getElementById('cs-step-ai');
    aiEl.style.display = 'block';
    const wn = document.getElementById('cs-wn').value, zeta = document.getElementById('cs-zeta').value;
    await askAI(
      `Explain the step response of a second-order control system to an ECE student, given ωn=${wn} rad/s and ζ=${zeta}. ` +
      `Cover: 1. What ωn and ζ physically represent 2. Underdamped vs critically damped vs overdamped behavior ` +
      `3. What peak overshoot and settling time mean and how they're calculated 4. Why damping ratio matters in real system design. Be clear and concise.`,
      aiEl
    );
  }

  async function explainBode() {
    const aiEl = document.getElementById('cs-bode-ai');
    aiEl.style.display = 'block';
    await askAI(
      `Explain Bode plots (magnitude and phase vs frequency) for a second-order system to an ECE student. ` +
      `Cover: 1. What the magnitude plot in dB tells us 2. What the phase plot tells us 3. What resonant peak and bandwidth mean ` +
      `4. How damping ratio ζ affects the resonant peak. Be clear and concise.`,
      aiEl
    );
  }

  return { init, onShow, drawStep, drawBode, explainStep, explainBode };
})();

/* ══════════════════════════════════════
   DIGITAL SIGNAL PROCESSING

const DSPLab = (() => {
  let sigCanvas2, sigCtx2, filtCanvas, filtCtx;

  function init() {
    const p = document.getElementById('panel-dsp');
    p.innerHTML = `
      <div class="sec">Digital Signal Processing</div>

      <div class="card" style="margin-bottom:16px">
        <h4>Signal Builder + DFT Spectrum</h4>
        <div class="row">
          <div class="col"><label>f1 (Hz)</label><input type="number" id="dsp-f1" value="3" min="1" max="16" step="1" oninput="DSPLab.drawSpectrum()"></div>
          <div class="col"><label>A1</label><input type="number" id="dsp-a1" value="1" min="0" max="1" step="0.1" oninput="DSPLab.drawSpectrum()"></div>
          <div class="col"><label>f2 (Hz)</label><input type="number" id="dsp-f2" value="7" min="1" max="16" step="1" oninput="DSPLab.drawSpectrum()"></div>
          <div class="col"><label>A2</label><input type="number" id="dsp-a2" value="0.5" min="0" max="1" step="0.1" oninput="DSPLab.drawSpectrum()"></div>
        </div>
        <canvas id="dspsigcanvas" style="margin-top:12px"></canvas>
        <div id="dsp-out" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="DSPLab.explainFFT()">✨ AI Explain</button>
        <div id="dsp-fft-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>

      <div class="card">
        <h4>RC Filter Frequency Response</h4>
        <div class="row">
          <div class="col">
            <label>Filter Type</label>
            <select id="dsp-type" onchange="DSPLab.drawFilter()">
              <option value="lpf">Low-Pass (LPF)</option>
              <option value="hpf">High-Pass (HPF)</option>
            </select>
          </div>
          <div class="col"><label>R (kΩ)</label><input type="number" id="dsp-r" value="1.6" min="0.1" max="1000" step="0.1" oninput="DSPLab.drawFilter()"></div>
          <div class="col"><label>C (nF)</label><input type="number" id="dsp-c" value="10" min="0.1" max="1000" step="0.1" oninput="DSPLab.drawFilter()"></div>
        </div>
        <canvas id="filtcanvas" style="margin-top:12px"></canvas>
        <div id="dsp-filt-out" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="DSPLab.explainFilter()">✨ AI Explain</button>
        <div id="dsp-filt-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>
    `;
    sigCanvas2 = document.getElementById('dspsigcanvas'); sigCtx2 = sigCanvas2.getContext('2d');
    sigCanvas2.width = sigCanvas2.offsetWidth; sigCanvas2.height = 260;
    filtCanvas = document.getElementById('filtcanvas'); filtCtx = filtCanvas.getContext('2d');
    filtCanvas.width = filtCanvas.offsetWidth; filtCanvas.height = 220;
    drawSpectrum(); drawFilter();
  }

  function onShow() {
    if (sigCanvas2) { sigCanvas2.width = sigCanvas2.offsetWidth; drawSpectrum(); }
    if (filtCanvas) { filtCanvas.width = filtCanvas.offsetWidth; drawFilter(); }
  }

  function drawSpectrum() {
    if (!sigCanvas2) return;
    const f1 = +document.getElementById('dsp-f1').value, a1 = +document.getElementById('dsp-a1').value;
    const f2 = +document.getElementById('dsp-f2').value, a2 = +document.getElementById('dsp-a2').value;
    const N = 64;
    const x = [];
    for (let n = 0; n < N; n++) {
      x.push(a1 * Math.sin(2*Math.PI*f1*n/N) + a2 * Math.sin(2*Math.PI*f2*n/N));
    }
    // naive DFT magnitude, first half (positive freqs)
    const mags = [];
    for (let k = 0; k < N/2; k++) {
      let re = 0, im = 0;
      for (let n = 0; n < N; n++) {
        const ang = -2*Math.PI*k*n/N;
        re += x[n]*Math.cos(ang); im += x[n]*Math.sin(ang);
      }
      mags.push(Math.sqrt(re*re+im*im)/N*2);
    }

    const W = sigCanvas2.width, H = sigCanvas2.height, rowH = H/2;
    sigCtx2.clearRect(0,0,W,H);
    const ox = 44, pw = W - 60;
    // time domain
    sigCtx2.strokeStyle = 'rgba(255,255,255,0.1)'; sigCtx2.lineWidth=1;
    sigCtx2.beginPath(); sigCtx2.moveTo(ox, rowH*0.5); sigCtx2.lineTo(ox+pw, rowH*0.5); sigCtx2.stroke();
    sigCtx2.fillStyle='#6b6b80'; sigCtx2.font='10px JetBrains Mono';
    sigCtx2.fillText('Time domain x[n]', 4, rowH*0.5 - rowH*0.35);
    sigCtx2.strokeStyle='#00ff9d'; sigCtx2.lineWidth=1.8; sigCtx2.beginPath();
    x.forEach((v,n) => {
      const px = ox + (n/N)*pw, py = rowH*0.5 - v*(rowH*0.35);
      n===0?sigCtx2.moveTo(px,py):sigCtx2.lineTo(px,py);
    });
    sigCtx2.stroke();
    // frequency domain (bars)
    sigCtx2.strokeStyle = 'rgba(255,255,255,0.1)'; sigCtx2.beginPath();
    sigCtx2.moveTo(ox, rowH*1.9); sigCtx2.lineTo(ox+pw, rowH*1.9); sigCtx2.stroke();
    sigCtx2.fillText('Frequency spectrum |X[k]|', 4, rowH*1.5 - rowH*0.35);
    const maxMag = Math.max(...mags, 0.01);
    const barW = pw / (N/2);
    sigCtx2.fillStyle = '#3b82f6';
    mags.forEach((m,k) => {
      const bh = (m/maxMag) * rowH * 0.75;
      sigCtx2.fillRect(ox + k*barW + 1, rowH*1.9 - bh, Math.max(barW-2,1), bh);
    });
    sigCtx2.fillStyle = '#6b6b80'; sigCtx2.font = '9px JetBrains Mono';
    sigCtx2.fillText('k (bin)', ox+pw-40, rowH*1.9+14);

    document.getElementById('dsp-out').innerHTML =
      `N = <span class="eq" style="color:var(--accent)">${N}</span> samples &nbsp;|&nbsp; ` +
      `Peaks expected near bins <span class="eq" style="color:var(--accent)">k=${f1}</span> and <span class="eq" style="color:var(--accent)">k=${f2}</span>`;
  }

  function drawFilter() {
    if (!filtCanvas) return;
    const type = document.getElementById('dsp-type').value;
    const R = +document.getElementById('dsp-r').value * 1e3;
    const C = +document.getElementById('dsp-c').value * 1e-9;
    const fc = 1 / (2*Math.PI*R*C);
    const W = filtCanvas.width, H = filtCanvas.height;
    filtCtx.clearRect(0,0,W,H);
    const ox = 44, oy = H-26, pw = W-60, ph = H-46;
    filtCtx.strokeStyle='rgba(255,255,255,0.12)'; filtCtx.lineWidth=1;
    filtCtx.beginPath(); filtCtx.moveTo(ox,oy); filtCtx.lineTo(ox+pw,oy); filtCtx.stroke();
    filtCtx.beginPath(); filtCtx.moveTo(ox,oy); filtCtx.lineTo(ox,oy-ph); filtCtx.stroke();
    filtCtx.fillStyle='#6b6b80'; filtCtx.font='10px JetBrains Mono';
    filtCtx.fillText('log f →', ox+pw-40, oy+18); filtCtx.fillText('Gain (dB)', ox-36, oy-ph-4);

    const fMin = fc/1000, fMax = fc*1000;
    filtCtx.strokeStyle='#00ff9d'; filtCtx.lineWidth=2; filtCtx.beginPath();
    for (let i=0;i<=pw;i++) {
      const logf = Math.log10(fMin) + (i/pw)*(Math.log10(fMax)-Math.log10(fMin));
      const f = Math.pow(10, logf);
      const ratio = f/fc;
      const magLin = type==='lpf' ? 1/Math.sqrt(1+ratio*ratio) : ratio/Math.sqrt(1+ratio*ratio);
      const db = 20*Math.log10(magLin);
      const y = oy - ((db+60)/60) * ph; // -60dB..0dB mapped to full height
      i===0?filtCtx.moveTo(ox+i,y):filtCtx.lineTo(ox+i,y);
    }
    filtCtx.stroke();
    // mark cutoff
    const cutX = ox + ((Math.log10(fc)-Math.log10(fMin))/(Math.log10(fMax)-Math.log10(fMin)))*pw;
    filtCtx.strokeStyle='rgba(255,255,255,0.3)'; filtCtx.setLineDash([4,4]);
    filtCtx.beginPath(); filtCtx.moveTo(cutX,oy); filtCtx.lineTo(cutX,oy-ph); filtCtx.stroke();
    filtCtx.setLineDash([]);
    filtCtx.fillStyle='#f59e0b'; filtCtx.fillText('fc', cutX+4, oy-ph+10);

    document.getElementById('dsp-filt-out').innerHTML =
      `Cutoff frequency fc = <span class="eq" style="color:var(--accent)">${fc.toFixed(1)} Hz</span> &nbsp;|&nbsp; ` +
      `Roll-off: <span class="eq" style="color:var(--accent)">20 dB/decade</span> (single-pole RC)`;
  }

  async function explainFFT() {
    const aiEl = document.getElementById('dsp-fft-ai');
    aiEl.style.display = 'block';
    await askAI(
      `Explain the Discrete Fourier Transform (DFT/FFT) to an ECE student using a simple example of two summed sine waves. ` +
      `Cover: 1. Why we move a signal from time domain to frequency domain 2. What each frequency bin k represents ` +
      `3. Why the magnitude spectrum shows peaks at the input frequencies 4. Difference between DFT and FFT (just complexity). Be clear and concise.`,
      aiEl
    );
  }

  async function explainFilter() {
    const aiEl = document.getElementById('dsp-filt-ai');
    aiEl.style.display = 'block';
    const type = document.getElementById('dsp-type').value;
    await askAI(
      `Explain a single-pole RC ${type==='lpf'?'low-pass':'high-pass'} filter to an ECE student. ` +
      `Cover: 1. How the circuit works 2. What the cutoff frequency fc=1/(2πRC) means ` +
      `3. Why roll-off is 20dB/decade for a single pole 4. One practical use case. Be clear and concise.`,
      aiEl
    );
  }

  return { init, onShow, drawSpectrum, drawFilter, explainFFT, explainFilter };
})();

/* ══════════════════════════════════════
   MICROPROCESSORS — Mini CPU Simulator
══════════════════════════════════════ */
const CPUSim = (() => {
  let program = [], pc = 0, A = 0, B = 0, flags = {Z:0,C:0}, running = false, timer = null;
  const DEFAULT = `MOV A, 5\nMOV B, 3\nADD B\nSUB B\nINC A\nMOV B, 0\nJZ 7\nJMP 0\nHLT`;

  function init() {
    const p = document.getElementById('panel-micro');
    p.innerHTML = `
      <div class="sec">Microprocessors — Mini Accumulator CPU</div>
      <div class="hint"><b>Instruction set</b><br>
        MOV A,n &nbsp;·&nbsp; MOV B,n &nbsp;·&nbsp; ADD B &nbsp;·&nbsp; SUB B &nbsp;·&nbsp;
        INC A &nbsp;·&nbsp; DEC A &nbsp;·&nbsp; JZ addr &nbsp;·&nbsp; JMP addr &nbsp;·&nbsp; HLT<br>
        Line numbers (0-indexed) are the jump targets.</div>

      <div class="card">
        <textarea id="cpu-src" style="width:100%;min-height:160px;background:var(--bg);color:var(--text);
          font-family:var(--mono);font-size:12.5px;border:1px solid var(--border);border-radius:8px;
          padding:10px;resize:vertical">${DEFAULT}</textarea>
        <div class="row" style="margin-top:10px">
          <button class="btn btn-g" onclick="CPUSim.load()">⟳ Assemble & Reset</button>
          <button class="btn btn-g" onclick="CPUSim.step()">⏭ Step</button>
          <button class="btn btn-g" id="cpu-run-btn" onclick="CPUSim.toggleRun()">▶ Run</button>
        </div>

        <div class="row" style="margin-top:14px;gap:20px">
          <div class="col" style="flex:1">
            <div style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:6px">REGISTERS</div>
            <div id="cpu-regs" style="font-family:var(--mono);font-size:15px;line-height:2"></div>
          </div>
          <div class="col" style="flex:2">
            <div style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:6px">PROGRAM</div>
            <div id="cpu-prog" style="font-family:var(--mono);font-size:12.5px;line-height:1.8;max-height:200px;overflow-y:auto"></div>
          </div>
        </div>
        <div id="cpu-msg" style="font-family:var(--mono);font-size:12px;color:var(--accent);margin-top:10px"></div>
      </div>
    `;
    load();
  }

  function onShow() {}

  function load() {
    if (timer) { clearInterval(timer); timer = null; }
    running = false;
    const btn = document.getElementById('cpu-run-btn'); if (btn) btn.textContent = '▶ Run';
    const src = document.getElementById('cpu-src').value;
    program = src.split('\n').map(l => l.trim()).filter(l => l.length);
    pc = 0; A = 0; B = 0; flags = {Z:0,C:0};
    document.getElementById('cpu-msg').textContent = `Loaded ${program.length} instructions.`;
    render();
  }

  function step() {
    if (pc >= program.length) { document.getElementById('cpu-msg').textContent = 'Program halted (PC past end).'; return; }
    const line = program[pc];
    const msgEl = document.getElementById('cpu-msg');
    const parts = line.replace(',', ' ').split(/\s+/).filter(Boolean);
    const op = (parts[0] || '').toUpperCase();
    try {
      switch (op) {
        case 'MOV':
          if (parts[1].toUpperCase() === 'A') A = parseInt(parts[2]);
          else if (parts[1].toUpperCase() === 'B') B = parseInt(parts[2]);
          pc++; break;
        case 'ADD': A = A + B; flags.Z = A === 0 ? 1 : 0; flags.C = A > 255 ? 1 : 0; A &= 0xFF; pc++; break;
        case 'SUB': A = A - B; flags.Z = A === 0 ? 1 : 0; flags.C = A < 0 ? 1 : 0; A = ((A % 256) + 256) % 256; pc++; break;
        case 'INC': A = (A + 1) & 0xFF; flags.Z = A === 0 ? 1 : 0; pc++; break;
        case 'DEC': A = (A - 1 + 256) & 0xFF; flags.Z = A === 0 ? 1 : 0; pc++; break;
        case 'JZ': pc = flags.Z ? parseInt(parts[1]) : pc + 1; break;
        case 'JMP': pc = parseInt(parts[1]); break;
        case 'HLT': pc = program.length; if (timer) { clearInterval(timer); timer = null; running = false; document.getElementById('cpu-run-btn').textContent = '▶ Run'; } msgEl.textContent = 'HLT — program finished.'; break;
        default: msgEl.textContent = `Unknown instruction: "${line}"`; pc++;
      }
      if (op !== 'HLT') msgEl.textContent = `Executed: ${line}`;
    } catch (e) {
      msgEl.textContent = `Error at line ${pc}: "${line}"`;
      if (timer) { clearInterval(timer); timer = null; running = false; }
    }
    render();
  }

  function toggleRun() {
    const btn = document.getElementById('cpu-run-btn');
    if (running) { clearInterval(timer); timer = null; running = false; btn.textContent = '▶ Run'; return; }
    running = true; btn.textContent = '⏸ Pause';
    timer = setInterval(() => {
      if (pc >= program.length) { clearInterval(timer); timer = null; running = false; btn.textContent = '▶ Run'; return; }
      step();
    }, 500);
  }

  function render() {
    document.getElementById('cpu-regs').innerHTML =
      `PC = <span style="color:var(--accent)">${pc}</span><br>` +
      `A &nbsp;= <span style="color:var(--accent)">${A}</span><br>` +
      `B &nbsp;= <span style="color:var(--accent)">${B}</span><br>` +
      `Z flag = <span style="color:var(--accent)">${flags.Z}</span> &nbsp; C flag = <span style="color:var(--accent)">${flags.C}</span>`;
    document.getElementById('cpu-prog').innerHTML = program.map((l, i) =>
      `<div style="padding:2px 6px;border-radius:4px;${i===pc?'background:rgba(0,255,157,.12);color:var(--accent)':'color:var(--muted)'}">${i}: ${l}</div>`
    ).join('');
  }

  return { init, onShow, load, step, toggleRun };
})();

/* ══════════════════════════════════════
   ELECTROMAGNETICS — Smith Chart
══════════════════════════════════════ */
const EMLab = (() => {
  let smCanvas, smCtx;

  function init() {
    const p = document.getElementById('panel-em');
    p.innerHTML = `
      <div class="sec">Electromagnetics — Transmission Line Calculator</div>
      <div class="hint"><b>What this shows</b><br>Reflection coefficient Γ and VSWR for a load impedance ZL
        on a transmission line of characteristic impedance Z0, plotted on a simplified Smith chart.</div>

      <div class="card">
        <div class="row">
          <div class="col"><label>Z0 (Ω, characteristic impedance)</label><input type="number" id="em-z0" value="50" min="1" max="600" step="1" oninput="EMLab.draw()"></div>
          <div class="col"><label>ZL Real part R (Ω)</label><input type="number" id="em-zr" value="75" min="0" max="600" step="1" oninput="EMLab.draw()"></div>
          <div class="col"><label>ZL Imag part X (Ω)</label><input type="number" id="em-zx" value="25" min="-300" max="300" step="1" oninput="EMLab.draw()"></div>
        </div>
        <canvas id="smithcanvas" style="margin-top:12px"></canvas>
        <div id="em-out" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px;line-height:1.8"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="EMLab.explain()">✨ AI Explain</button>
        <div id="em-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>
    `;
    smCanvas = document.getElementById('smithcanvas'); smCtx = smCanvas.getContext('2d');
    smCanvas.width = smCanvas.offsetWidth; smCanvas.height = 320;
    draw();
  }

  function onShow() {
    if (smCanvas) { smCanvas.width = smCanvas.offsetWidth; smCanvas.height = 320; draw(); }
  }

  function draw() {
    if (!smCanvas) return;
    const Z0 = +document.getElementById('em-z0').value;
    const R = +document.getElementById('em-zr').value;
    const X = +document.getElementById('em-zx').value;

    // reflection coefficient Γ = (ZL - Z0) / (ZL + Z0), complex
    const numRe = R - Z0, numIm = X;
    const denRe = R + Z0, denIm = X;
    const denMagSq = denRe*denRe + denIm*denIm;
    const gRe = (numRe*denRe + numIm*denIm) / denMagSq;
    const gIm = (numIm*denRe - numRe*denIm) / denMagSq;
    const gMag = Math.sqrt(gRe*gRe + gIm*gIm);
    const gAngle = Math.atan2(gIm, gRe) * 180 / Math.PI;
    const vswr = gMag < 1 ? (1 + gMag) / (1 - gMag) : Infinity;

    const W = smCanvas.width, H = smCanvas.height;
    smCtx.clearRect(0, 0, W, H);
    const cx = W/2, cy = H/2, rad = Math.max(Math.min(W,H)/2 - 24, 5);

    // outer unit circle (|Γ|=1 boundary)
    smCtx.strokeStyle = 'rgba(255,255,255,0.25)'; smCtx.lineWidth = 1.5;
    smCtx.beginPath(); smCtx.arc(cx, cy, rad, 0, 2*Math.PI); smCtx.stroke();
    // horizontal axis (X=0 line, real axis)
    smCtx.strokeStyle = 'rgba(255,255,255,0.12)';
    smCtx.beginPath(); smCtx.moveTo(cx-rad, cy); smCtx.lineTo(cx+rad, cy); smCtx.stroke();
    smCtx.beginPath(); smCtx.moveTo(cx, cy-rad); smCtx.lineTo(cx, cy+rad); smCtx.stroke();
    // a few constant-resistance circles for visual reference (r=0,0.5,1,2 normalized)
    [0, 0.5, 1, 2].forEach(r => {
      const cRad = rad / (r + 1);
      const cxr = cx + rad - cRad;
      smCtx.strokeStyle = 'rgba(0,255,157,0.15)';
      smCtx.beginPath(); smCtx.arc(cxr, cy, cRad, 0, 2*Math.PI); smCtx.stroke();
    });
    smCtx.fillStyle = '#6b6b80'; smCtx.font = '10px JetBrains Mono';
    smCtx.fillText('|Γ|=1', cx + rad - 34, cy - 6);

    // Γ locus circle (constant |Γ|, varying line length / angle)
    smCtx.strokeStyle = 'rgba(59,130,246,0.5)'; smCtx.setLineDash([3,3]);
    smCtx.beginPath(); smCtx.arc(cx, cy, gMag*rad, 0, 2*Math.PI); smCtx.stroke();
    smCtx.setLineDash([]);

    // Γ point
    const px = cx + gRe*rad, py = cy - gIm*rad;
    smCtx.fillStyle = '#00ff9d';
    smCtx.beginPath(); smCtx.arc(px, py, 6, 0, 2*Math.PI); smCtx.fill();
    smCtx.fillStyle = '#00ff9d'; smCtx.font = '11px JetBrains Mono';
    smCtx.fillText('Γ', px+9, py-8);
    smCtx.strokeStyle = 'rgba(0,255,157,0.4)';
    smCtx.beginPath(); smCtx.moveTo(cx,cy); smCtx.lineTo(px,py); smCtx.stroke();

    document.getElementById('em-out').innerHTML =
      `Reflection coeff. Γ = <span class="eq" style="color:var(--accent)">${gRe.toFixed(3)} ${gIm>=0?'+':'-'} j${Math.abs(gIm).toFixed(3)}</span><br>` +
      `|Γ| = <span class="eq" style="color:var(--accent)">${gMag.toFixed(3)}</span> &nbsp;|&nbsp; ` +
      `∠Γ = <span class="eq" style="color:var(--accent)">${gAngle.toFixed(1)}°</span> &nbsp;|&nbsp; ` +
      `VSWR = <span class="eq" style="color:var(--accent)">${vswr===Infinity?'∞':vswr.toFixed(2)}</span>`;
  }

  async function explain() {
    const aiEl = document.getElementById('em-ai');
    aiEl.style.display = 'block';
    const Z0 = document.getElementById('em-z0').value, R = document.getElementById('em-zr').value, X = document.getElementById('em-zx').value;
    await askAI(
      `Explain reflection coefficient and VSWR on a transmission line to an ECE student, given Z0=${Z0}Ω and ZL=${R}+j${X}Ω. ` +
      `Cover: 1. What the reflection coefficient Γ represents physically 2. Why impedance mismatch causes reflections ` +
      `3. What VSWR means and why we want it close to 1 4. What the Smith chart is used for in practice. Be clear and concise.`,
      aiEl
    );
  }

  return { init, onShow, draw, explain };
})();

   VLSI / SEMICONDUCTOR DEVICES

const VLSILab = (() => {
  let mCanvas, mCtx, cCanvas3, cCtx3;

  function init() {
    const p = document.getElementById('panel-vlsi');
    p.innerHTML = `
      <div class="sec">VLSI &amp; Semiconductor Devices</div>

      <div class="card" style="margin-bottom:16px">
        <h4>MOSFET I-V Characteristics (NMOS, square-law model)</h4>
        <div class="row">
          <div class="col"><label>Threshold Voltage VT (V)</label><input type="number" id="vl-vt" value="1" min="0.2" max="3" step="0.1" oninput="VLSILab.drawMosfet()"></div>
          <div class="col"><label>k = ½µnCox(W/L) (mA/V²)</label><input type="number" id="vl-k" value="1" min="0.1" max="5" step="0.1" oninput="VLSILab.drawMosfet()"></div>
          <div class="col"><label>λ (channel length mod.)</label><input type="number" id="vl-lambda" value="0.02" min="0" max="0.2" step="0.01" oninput="VLSILab.drawMosfet()"></div>
        </div>
        <canvas id="mosfetcanvas" style="margin-top:12px"></canvas>
        <div id="vl-mosfet-out" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="VLSILab.explainMosfet()">✨ AI Explain</button>
        <div id="vl-mosfet-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>

      <div class="card">
        <h4>CMOS Inverter Voltage Transfer Characteristic</h4>
        <div class="row">
          <div class="col"><label>Supply VDD (V)</label><input type="number" id="vl-vdd" value="5" min="1" max="12" step="0.5" oninput="VLSILab.drawCmos()"></div>
          <div class="col"><label>PMOS/NMOS drive ratio (Wp/Wn)</label><input type="number" id="vl-ratio" value="1" min="0.2" max="4" step="0.1" oninput="VLSILab.drawCmos()"></div>
        </div>
        <canvas id="cmoscanvas" style="margin-top:12px"></canvas>
        <div id="vl-cmos-out" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="VLSILab.explainCmos()">✨ AI Explain</button>
        <div id="vl-cmos-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>
    `;
    mCanvas = document.getElementById('mosfetcanvas'); mCtx = mCanvas.getContext('2d');
    mCanvas.width = mCanvas.offsetWidth; mCanvas.height = 240;
    cCanvas3 = document.getElementById('cmoscanvas'); cCtx3 = cCanvas3.getContext('2d');
    cCanvas3.width = cCanvas3.offsetWidth; cCanvas3.height = 220;
    drawMosfet(); drawCmos();
  }

  function onShow() {
    if (mCanvas) { mCanvas.width = mCanvas.offsetWidth; drawMosfet(); }
    if (cCanvas3) { cCanvas3.width = cCanvas3.offsetWidth; drawCmos(); }
  }

  function drawMosfet() {
    if (!mCanvas || mCanvas.width < 10) return;
    const VT = +document.getElementById('vl-vt').value;
    const k = +document.getElementById('vl-k').value;
    const lambda = +document.getElementById('vl-lambda').value;
    const W = mCanvas.width, H = mCanvas.height;
    mCtx.clearRect(0,0,W,H);
    const ox=44, oy=H-26, pw=Math.max(W-60,10), ph=H-46;
    mCtx.strokeStyle='rgba(255,255,255,0.12)'; mCtx.lineWidth=1;
    mCtx.beginPath(); mCtx.moveTo(ox,oy); mCtx.lineTo(ox+pw,oy); mCtx.stroke();
    mCtx.beginPath(); mCtx.moveTo(ox,oy); mCtx.lineTo(ox,oy-ph); mCtx.stroke();
    mCtx.fillStyle='#6b6b80'; mCtx.font='10px JetBrains Mono';
    mCtx.fillText('VDS (0-5V)', ox+pw-58, oy+18); mCtx.fillText('ID (mA)', ox-36, oy-ph-4);

    const vdsMax = 5;
    const colors = ['#00ff9d','#3b82f6','#f59e0b'];
    let maxI = 0.001;
    const curves = [1,2,3].map(d => {
      const vgs = VT + d;
      const pts = [];
      for (let i=0;i<=pw;i++) {
        const vds = (i/pw)*vdsMax;
        const vov = vgs - VT;
        let id = vds < vov ? k*(2*vov*vds - vds*vds) : k*vov*vov*(1+lambda*vds);
        pts.push(id); if (id>maxI) maxI=id;
      }
      return {vgs, pts};
    });
    curves.forEach((c,ci) => {
      mCtx.strokeStyle = colors[ci]; mCtx.lineWidth=2; mCtx.beginPath();
      c.pts.forEach((id,i) => {
        const y = oy - (id/maxI)*ph;
        i===0?mCtx.moveTo(ox+i,y):mCtx.lineTo(ox+i,y);
      });
      mCtx.stroke();
      mCtx.fillStyle = colors[ci]; mCtx.font='10px JetBrains Mono';
      mCtx.fillText(`VGS=${c.vgs.toFixed(1)}V`, ox+pw-70, oy-ph+14+ci*14);
    });

    document.getElementById('vl-mosfet-out').innerHTML =
      `Overdrive voltage (VGS-VT) sets the saturation current level &nbsp;|&nbsp; ` +
      `Knee at VDS = VGS-VT marks triode→saturation transition`;
  }

  function drawCmos() {
    if (!cCanvas3 || cCanvas3.width < 10) return;
    const VDD = +document.getElementById('vl-vdd').value;
    const ratio = +document.getElementById('vl-ratio').value;
    const W = cCanvas3.width, H = cCanvas3.height;
    cCtx3.clearRect(0,0,W,H);
    const ox=44, oy=H-26, pw=Math.max(W-60,10), ph=H-46;
    cCtx3.strokeStyle='rgba(255,255,255,0.12)'; cCtx3.lineWidth=1;
    cCtx3.beginPath(); cCtx3.moveTo(ox,oy); cCtx3.lineTo(ox+pw,oy); cCtx3.stroke();
    cCtx3.beginPath(); cCtx3.moveTo(ox,oy); cCtx3.lineTo(ox,oy-ph); cCtx3.stroke();
    cCtx3.fillStyle='#6b6b80'; cCtx3.font='10px JetBrains Mono';
    cCtx3.fillText('Vin', ox+pw-24, oy+18); cCtx3.fillText('Vout', ox-30, oy-ph-4);

    // switching threshold shifts with drive ratio (higher Wp/Wn pulls Vth up)
    const vth = VDD * (Math.sqrt(ratio)) / (1 + Math.sqrt(ratio));
    const steep = 10 / VDD;
    cCtx3.strokeStyle='#00ff9d'; cCtx3.lineWidth=2; cCtx3.beginPath();
    for (let i=0;i<=pw;i++) {
      const vin = (i/pw)*VDD;
      const vout = VDD / (1 + Math.exp((vin - vth) * steep));
      const y = oy - (vout/VDD)*ph;
      i===0?cCtx3.moveTo(ox+i,y):cCtx3.lineTo(ox+i,y);
    }
    cCtx3.stroke();
    // mark Vth
    const vthX = ox + (vth/VDD)*pw;
    cCtx3.strokeStyle='rgba(255,255,255,0.3)'; cCtx3.setLineDash([4,4]);
    cCtx3.beginPath(); cCtx3.moveTo(vthX,oy); cCtx3.lineTo(vthX,oy-ph); cCtx3.stroke();
    cCtx3.setLineDash([]);
    cCtx3.fillStyle='#f59e0b'; cCtx3.fillText('Vth', vthX+4, oy-ph+10);

    document.getElementById('vl-cmos-out').innerHTML =
      `Switching threshold Vth ≈ <span class="eq" style="color:var(--accent)">${vth.toFixed(2)} V</span> ` +
      `(ideal midpoint would be ${(VDD/2).toFixed(2)} V)`;
  }

  async function explainMosfet() {
    const aiEl = document.getElementById('vl-mosfet-ai'); aiEl.style.display='block';
    await askAI(`Explain the NMOS transistor I-V characteristics (square-law model) to an ECE student. Cover: 1. Triode vs saturation region 2. What threshold voltage VT and overdrive voltage mean 3. Why ID depends on (VGS-VT)² in saturation 4. What channel length modulation (λ) does. Be clear and concise.`, aiEl);
  }
  async function explainCmos() {
    const aiEl = document.getElementById('vl-cmos-ai'); aiEl.style.display='block';
    await askAI(`Explain the CMOS inverter voltage transfer characteristic (VTC) to an ECE student. Cover: 1. Why the output switches sharply near the threshold 2. What determines the switching threshold Vth 3. Why PMOS/NMOS sizing ratio matters 4. Why CMOS has near-zero static power. Be clear and concise.`, aiEl);
  }

  return { init, onShow, drawMosfet, drawCmos, explainMosfet, explainCmos };
})();

/* ══════════════════════════════════════
   DIGITAL COMMUNICATION
══════════════════════════════════════ */
const DigiComm = (() => {
  let lcCanvas, lcCtx;
  let hamBits = [1,0,1,1];
  let errorPos = 0;

  function init() {
    const p = document.getElementById('panel-digicomm');
    p.innerHTML = `
      <div class="sec">Digital Communication</div>

      <div class="card" style="margin-bottom:16px">
        <h4>Line Coding Visualizer</h4>
        <div class="row">
          <div class="col" style="flex:2">
            <label>Bit Sequence</label>
            <input type="text" id="dc-bits" value="1011001" maxlength="16" oninput="DigiComm.drawLine()">
          </div>
          <div class="col">
            <label>Scheme</label>
            <select id="dc-scheme" onchange="DigiComm.drawLine()">
              <option value="nrzl">NRZ-L</option>
              <option value="nrzi">NRZ-I</option>
              <option value="manchester">Manchester</option>
              <option value="ami">AMI</option>
            </select>
          </div>
        </div>
        <canvas id="linecodecanvas" style="margin-top:12px"></canvas>
        <button class="btn btn-p" style="margin-top:10px" onclick="DigiComm.explainLine()">✨ AI Explain</button>
        <div id="dc-line-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>

      <div class="card">
        <h4>Hamming(7,4) Error Correction</h4>
        <div class="hint"><b>How it works</b><br>4 data bits + 3 parity bits (positions 1,2,4) form a 7-bit codeword.
          Flip any bit to simulate a transmission error, then decode — the syndrome points straight at the corrupted position.</div>
        <div class="row" style="margin-top:12px">
          <div class="col"><label>Data bit d1</label><input type="number" id="dc-d1" min="0" max="1" value="1" oninput="DigiComm.updateHam()"></div>
          <div class="col"><label>Data bit d2</label><input type="number" id="dc-d2" min="0" max="1" value="0" oninput="DigiComm.updateHam()"></div>
          <div class="col"><label>Data bit d3</label><input type="number" id="dc-d3" min="0" max="1" value="1" oninput="DigiComm.updateHam()"></div>
          <div class="col"><label>Data bit d4</label><input type="number" id="dc-d4" min="0" max="1" value="1" oninput="DigiComm.updateHam()"></div>
        </div>
        <div id="dc-ham-code" style="font-family:var(--mono);font-size:14px;margin-top:14px;letter-spacing:2px"></div>
        <div class="row" style="margin-top:12px">
          <div class="col"><label>Flip bit position (1-7, 0=none)</label><input type="number" id="dc-errpos" min="0" max="7" value="0" oninput="DigiComm.updateHam()"></div>
          <div class="col" style="flex:2">
            <label>&nbsp;</label>
            <button class="btn btn-g" onclick="DigiComm.decodeHam()">🔍 Decode &amp; Correct</button>
          </div>
        </div>
        <div id="dc-ham-out" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px;line-height:1.8"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="DigiComm.explainHam()">✨ AI Explain</button>
        <div id="dc-ham-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>
    `;
    lcCanvas = document.getElementById('linecodecanvas'); lcCtx = lcCanvas.getContext('2d');
    lcCanvas.width = lcCanvas.offsetWidth; lcCanvas.height = 180;
    drawLine(); updateHam();
  }

  function onShow() {
    if (lcCanvas) { lcCanvas.width = lcCanvas.offsetWidth; drawLine(); }
  }

  function drawLine() {
    if (!lcCanvas || lcCanvas.width < 10) return;
    const raw = document.getElementById('dc-bits').value.replace(/[^01]/g,'');
    const bits = raw.length ? raw.split('').map(Number) : [1,0,1,1];
    const scheme = document.getElementById('dc-scheme').value;
    const W = lcCanvas.width, H = lcCanvas.height;
    lcCtx.clearRect(0,0,W,H);
    const ox=10, pw=W-20, n=bits.length, bw=pw/n, midY=H/2, amp=H*0.32;

    lcCtx.strokeStyle='rgba(255,255,255,0.12)'; lcCtx.lineWidth=1;
    lcCtx.beginPath(); lcCtx.moveTo(ox,midY); lcCtx.lineTo(ox+pw,midY); lcCtx.stroke();

    // build level segments: each entry {t0,t1,level}
    let segs = [];
    if (scheme === 'nrzl') {
      bits.forEach((b,i) => segs.push({t0:i,t1:i+1,level:b?1:-1}));
    } else if (scheme === 'nrzi') {
      let level = -1;
      bits.forEach((b,i) => { if (b===1) level = -level; segs.push({t0:i,t1:i+1,level}); });
    } else if (scheme === 'manchester') {
      bits.forEach((b,i) => {
        if (b===1) { segs.push({t0:i,t1:i+0.5,level:1}); segs.push({t0:i+0.5,t1:i+1,level:-1}); }
        else       { segs.push({t0:i,t1:i+0.5,level:-1}); segs.push({t0:i+0.5,t1:i+1,level:1}); }
      });
    } else { // ami
      let last = -1;
      bits.forEach((b,i) => {
        if (b===0) segs.push({t0:i,t1:i+1,level:0});
        else { last = -last; segs.push({t0:i,t1:i+1,level:last}); }
      });
    }

    lcCtx.strokeStyle='#00ff9d'; lcCtx.lineWidth=2.2; lcCtx.beginPath();
    segs.forEach((s,i) => {
      const x0 = ox + s.t0*bw, x1 = ox + s.t1*bw, y = midY - s.level*amp;
      if (i===0) lcCtx.moveTo(x0,y); else lcCtx.lineTo(x0,y);
      lcCtx.lineTo(x1,y);
      if (i < segs.length-1) { const nextY = midY - segs[i+1].level*amp; lcCtx.lineTo(x1, nextY); }
    });
    lcCtx.stroke();

    lcCtx.strokeStyle='rgba(255,255,255,0.08)'; lcCtx.font='10px JetBrains Mono'; lcCtx.fillStyle='#6b6b80';
    bits.forEach((b,i) => {
      lcCtx.beginPath(); lcCtx.moveTo(ox+i*bw,10); lcCtx.lineTo(ox+i*bw,H-10); lcCtx.stroke();
      lcCtx.fillText(b, ox+i*bw+bw/2-3, 16);
    });
  }

  function hamEncode(d) {
    const c = new Array(8).fill(0); // 1-indexed, c[0] unused
    c[3]=d[0]; c[5]=d[1]; c[6]=d[2]; c[7]=d[3];
    c[1] = c[3]^c[5]^c[7];
    c[2] = c[3]^c[6]^c[7];
    c[4] = c[5]^c[6]^c[7];
    return c;
  }

  function updateHam() {
    const d = [0,1,2,3].map(i => parseInt(document.getElementById('dc-d'+(i+1)).value) & 1);
    const c = hamEncode(d);
    errorPos = parseInt(document.getElementById('dc-errpos').value) || 0;
    const tx = c.slice();
    if (errorPos >= 1 && errorPos <= 7) tx[errorPos] ^= 1;
    document.getElementById('dc-ham-code').innerHTML =
      `Encoded: <span style="color:var(--accent)">${c.slice(1).join(' ')}</span><br>` +
      `Transmitted${errorPos?' (bit '+errorPos+' flipped)':''}: <span style="color:${errorPos?'var(--red)':'var(--accent)'}">${tx.slice(1).join(' ')}</span>`;
    document.getElementById('dc-ham-out').innerHTML = '';
  }

  function decodeHam() {
    const codeStr = document.getElementById('dc-ham-code').innerHTML;
    const d = [0,1,2,3].map(i => parseInt(document.getElementById('dc-d'+(i+1)).value) & 1);
    const c = hamEncode(d);
    const tx = c.slice();
    if (errorPos >= 1 && errorPos <= 7) tx[errorPos] ^= 1;
    const s1 = tx[1]^tx[3]^tx[5]^tx[7];
    const s2 = tx[2]^tx[3]^tx[6]^tx[7];
    const s4 = tx[4]^tx[5]^tx[6]^tx[7];
    const syndrome = s1 + s2*2 + s4*4;
    const corrected = tx.slice();
    if (syndrome) corrected[syndrome] ^= 1;
    const recovered = [corrected[3],corrected[5],corrected[6],corrected[7]];
    document.getElementById('dc-ham-out').innerHTML =
      `Syndrome (s4 s2 s1) = <span class="eq" style="color:var(--accent)">${s4}${s2}${s1}</span> = ${syndrome} ` +
      `${syndrome ? '→ error at bit position '+syndrome : '→ no error detected'}<br>` +
      `Corrected codeword: <span class="eq" style="color:var(--accent)">${corrected.slice(1).join(' ')}</span><br>` +
      `Recovered data bits: <span class="eq" style="color:var(--accent)">${recovered.join(' ')}</span>`;
  }

  async function explainLine() {
    const aiEl = document.getElementById('dc-line-ai'); aiEl.style.display='block';
    const scheme = document.getElementById('dc-scheme').value;
    await askAI(`Explain the ${scheme.toUpperCase()} line coding scheme used in digital communication to an ECE student. Cover: 1. How bits map to voltage levels 2. Why this scheme is used (clock recovery, DC balance, etc.) 3. One drawback. Be clear and concise.`, aiEl);
  }
  async function explainHam() {
    const aiEl = document.getElementById('dc-ham-ai'); aiEl.style.display='block';
    await askAI(`Explain Hamming(7,4) error correction code to an ECE student. Cover: 1. Why parity bits are placed at positions 1,2,4 2. How the syndrome calculation pinpoints the error position 3. Why this code can correct exactly 1 bit error 4. One real-world use case. Be clear and concise.`, aiEl);
  }

  return { init, onShow, drawLine, updateHam, decodeHam, explainLine, explainHam };
})();

const NetworkLab = (() => {
  const OSI = [
    {n:7, name:'Application',  ex:'HTTP, FTP, DNS, SMTP', desc:'Interfaces directly with end-user software; defines how apps talk (requests, web pages, email).'},
    {n:6, name:'Presentation', ex:'SSL/TLS, JPEG, encryption', desc:'Translates, encrypts, and compresses data between application format and network format.'},
    {n:5, name:'Session',      ex:'NetBIOS, RPC, sockets', desc:'Establishes, manages, and terminates sessions (dialogue control) between two hosts.'},
    {n:4, name:'Transport',    ex:'TCP, UDP',              desc:'End-to-end delivery, segmentation, flow control, and error recovery (TCP) or best-effort delivery (UDP).'},
    {n:3, name:'Network',      ex:'IP, ICMP, routers',     desc:'Logical addressing (IP) and routing packets across different networks.'},
    {n:2, name:'Data Link',    ex:'Ethernet, MAC, switches',desc:'Frames bits for physical transmission, MAC addressing, error detection on the local link.'},
    {n:1, name:'Physical',     ex:'Cables, radio, hubs',   desc:'Raw bit transmission over a physical medium — voltages, light pulses, or radio waves.'},
  ];
  let encStep = 0;

  function init() {
    const p = document.getElementById('panel-network');
    p.innerHTML = `
      <div class="sec">Data Communication &amp; Networking</div>

      <div class="card" style="margin-bottom:16px">
        <h4>OSI 7-Layer Model</h4>
        <div id="osi-list"></div>
      </div>

      <div class="card">
        <h4>TCP/IP Encapsulation</h4>
        <div class="hint"><b>What this shows</b><br>As data travels down the stack, each layer wraps it with its own header (and sometimes a trailer) before handing it to the layer below.</div>
        <div class="row" style="margin-top:12px">
          <button class="btn btn-g" onclick="NetworkLab.stepEnc()">➕ Encapsulate Next Layer</button>
          <button class="btn btn-g" onclick="NetworkLab.resetEnc()">⟳ Reset</button>
        </div>
        <div id="enc-box" style="margin-top:16px;font-family:var(--mono);font-size:12px;line-height:1.6"></div>
      </div>
    `;
    const list = document.getElementById('osi-list');
    OSI.forEach(l => {
      const row = document.createElement('div');
      row.style.cssText = 'border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden;cursor:pointer';
      row.innerHTML = `
        <div style="padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:var(--s2)">
          <span style="font-family:var(--mono);font-weight:700;color:var(--accent)">L${l.n} — ${l.name}</span>
          <span style="font-size:11px;color:var(--muted)">${l.ex}</span>
        </div>
        <div class="osi-desc" style="display:none;padding:10px 14px;font-size:12.5px;color:var(--muted);line-height:1.7">${l.desc}</div>
      `;
      row.onclick = () => {
        const d = row.querySelector('.osi-desc');
        d.style.display = d.style.display === 'none' ? 'block' : 'none';
      };
      list.appendChild(row);
    });
    resetEnc();
  }

  function onShow() {}

  function resetEnc() {
    encStep = 0;
    renderEnc();
  }

  function stepEnc() {
    if (encStep < 4) encStep++;
    renderEnc();
  }

  function renderEnc() {
    const layers = [
      {label:'Application Data', color:'#6b6b80'},
      {label:'+ TCP/UDP Header (Transport)', color:'#3b82f6'},
      {label:'+ IP Header (Network) → now a Packet', color:'#f59e0b'},
      {label:'+ Frame Header/Trailer (Data Link) → now a Frame', color:'#00ff9d'},
      {label:'→ Transmitted as bits (Physical layer)', color:'#a855f7'},
    ];
    let html = '';
    for (let i = 0; i <= encStep; i++) {
      const pad = i * 14;
      html += `<div style="border:1px solid ${layers[i].color};border-radius:6px;padding:${8+pad*0.3}px;margin-left:${pad}px;color:${layers[i].color}">${layers[i].label}</div>`;
    }
    document.getElementById('enc-box').innerHTML = html;
  }

  return { init, onShow, stepEnc, resetEnc };
})();

const AntennaLab = (() => {
  let dpCanvas, dpCtx, plCanvas, plCtx;

  function init() {
    const p = document.getElementById('panel-antenna');
    p.innerHTML = `
      <div class="sec">Antenna &amp; Wave Propagation</div>

      <div class="card" style="margin-bottom:16px">
        <h4>Dipole Radiation Pattern (E-plane)</h4>
        <div class="row">
          <div class="col"><label>Dipole length L/λ</label><input type="number" id="an-len" value="0.5" min="0.1" max="1.5" step="0.05" oninput="AntennaLab.drawDipole()"></div>
        </div>
        <canvas id="dipolecanvas" style="margin-top:12px"></canvas>
        <div id="an2-out" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="AntennaLab.explainDipole()">✨ AI Explain</button>
        <div id="an2-dp-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>

      <div class="card">
        <h4>Friis Free-Space Path Loss</h4>
        <div class="row">
          <div class="col"><label>Frequency (MHz)</label><input type="number" id="an-f" value="900" min="1" max="100000" step="1" oninput="AntennaLab.drawPathLoss()"></div>
          <div class="col"><label>Distance (km)</label><input type="number" id="an-d" value="5" min="0.01" max="500" step="0.1" oninput="AntennaLab.drawPathLoss()"></div>
        </div>
        <div class="row">
          <div class="col"><label>Tx Power Pt (dBm)</label><input type="number" id="an-pt" value="30" min="-20" max="60" step="1" oninput="AntennaLab.drawPathLoss()"></div>
          <div class="col"><label>Gt (dBi)</label><input type="number" id="an-gt" value="10" min="0" max="40" step="0.5" oninput="AntennaLab.drawPathLoss()"></div>
          <div class="col"><label>Gr (dBi)</label><input type="number" id="an-gr" value="5" min="0" max="40" step="0.5" oninput="AntennaLab.drawPathLoss()"></div>
        </div>
        <canvas id="pathlosscanvas" style="margin-top:12px"></canvas>
        <div id="an-pl-out" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px;line-height:1.8"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="AntennaLab.explainPathLoss()">✨ AI Explain</button>
        <div id="an-pl-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>
    `;
    dpCanvas = document.getElementById('dipolecanvas'); dpCtx = dpCanvas.getContext('2d');
    dpCanvas.width = dpCanvas.offsetWidth; dpCanvas.height = 300;
    plCanvas = document.getElementById('pathlosscanvas'); plCtx = plCanvas.getContext('2d');
    plCanvas.width = plCanvas.offsetWidth; plCanvas.height = 220;
    drawDipole(); drawPathLoss();
  }

  function onShow() {
    if (dpCanvas) { dpCanvas.width = dpCanvas.offsetWidth; drawDipole(); }
    if (plCanvas) { plCanvas.width = plCanvas.offsetWidth; drawPathLoss(); }
  }

  function drawDipole() {
    if (!dpCanvas || dpCanvas.width < 10) return;
    const ratio = +document.getElementById('an-len').value;
    const W = dpCanvas.width, H = dpCanvas.height;
    dpCtx.clearRect(0,0,W,H);
    const cx = W/2, cy = H/2, rad = Math.max(Math.min(W,H)/2 - 30, 5);

    // grid rings
    dpCtx.strokeStyle = 'rgba(255,255,255,0.1)'; dpCtx.lineWidth = 1;
    [0.25,0.5,0.75,1].forEach(f => { dpCtx.beginPath(); dpCtx.arc(cx,cy,rad*f,0,2*Math.PI); dpCtx.stroke(); });
    dpCtx.beginPath(); dpCtx.moveTo(cx-rad,cy); dpCtx.lineTo(cx+rad,cy); dpCtx.stroke();
    dpCtx.beginPath(); dpCtx.moveTo(cx,cy-rad); dpCtx.lineTo(cx,cy+rad); dpCtx.stroke();
    dpCtx.fillStyle = '#6b6b80'; dpCtx.font = '10px JetBrains Mono';
    dpCtx.fillText('dipole axis ↑', cx+6, cy-rad+12);

    const kl = Math.PI * ratio; // π·(L/λ)
    let maxF = 0.001;
    const pts = [];
    for (let i=0;i<=360;i++) {
      const theta = i * Math.PI/180;
      const s = Math.sin(theta) || 1e-6;
      let f = (Math.cos(kl*Math.cos(theta)) - Math.cos(kl)) / s;
      f = Math.abs(f);
      pts.push(f); if (f>maxF) maxF=f;
    }
    dpCtx.strokeStyle = '#00ff9d'; dpCtx.lineWidth = 2; dpCtx.beginPath();
    pts.forEach((f,i) => {
      const theta = i*Math.PI/180;
      const r = (f/maxF) * rad;
      // theta measured from vertical axis (0 = up)
      const x = cx + r*Math.sin(theta), y = cy - r*Math.cos(theta);
      i===0?dpCtx.moveTo(x,y):dpCtx.lineTo(x,y);
    });
    dpCtx.closePath(); dpCtx.stroke();

    document.getElementById('an2-out').innerHTML =
      `Pattern is null along the dipole axis (θ=0°) and maximum broadside (θ=90°) &nbsp;|&nbsp; ` +
      `L/λ = <span class="eq" style="color:var(--accent)">${ratio.toFixed(2)}</span>`;
  }

  function drawPathLoss() {
    if (!plCanvas || plCanvas.width < 10) return;
    const f = +document.getElementById('an-f').value;
    const d = +document.getElementById('an-d').value;
    const Pt = +document.getElementById('an-pt').value;
    const Gt = +document.getElementById('an-gt').value;
    const Gr = +document.getElementById('an-gr').value;

    const fspl = d => 20*Math.log10(Math.max(d,1e-3)) + 20*Math.log10(f) + 32.44;
    const currentFSPL = fspl(d);
    const Pr = Pt + Gt + Gr - currentFSPL;

    const W = plCanvas.width, H = plCanvas.height;
    plCtx.clearRect(0,0,W,H);
    const ox=44, oy=H-26, pw=Math.max(W-60,10), ph=H-46;
    plCtx.strokeStyle='rgba(255,255,255,0.12)'; plCtx.lineWidth=1;
    plCtx.beginPath(); plCtx.moveTo(ox,oy); plCtx.lineTo(ox+pw,oy); plCtx.stroke();
    plCtx.beginPath(); plCtx.moveTo(ox,oy); plCtx.lineTo(ox,oy-ph); plCtx.stroke();
    plCtx.fillStyle='#6b6b80'; plCtx.font='10px JetBrains Mono';
    plCtx.fillText('distance (log, km)', ox+pw-90, oy+18); plCtx.fillText('FSPL (dB)', ox-36, oy-ph-4);

    const dMin=0.01, dMax=500;
    const fMin = fspl(dMin), fMax = fspl(dMax);
    plCtx.strokeStyle='#00ff9d'; plCtx.lineWidth=2; plCtx.beginPath();
    for (let i=0;i<=pw;i++) {
      const logd = Math.log10(dMin) + (i/pw)*(Math.log10(dMax)-Math.log10(dMin));
      const dv = Math.pow(10, logd);
      const y = oy - ((fspl(dv)-fMin)/(fMax-fMin))*ph;
      i===0?plCtx.moveTo(ox+i,y):plCtx.lineTo(ox+i,y);
    }
    plCtx.stroke();
    const curX = ox + ((Math.log10(d)-Math.log10(dMin))/(Math.log10(dMax)-Math.log10(dMin)))*pw;
    const curY = oy - ((currentFSPL-fMin)/(fMax-fMin))*ph;
    plCtx.fillStyle='#f59e0b'; plCtx.beginPath(); plCtx.arc(curX,curY,5,0,2*Math.PI); plCtx.fill();

    document.getElementById('an-pl-out').innerHTML =
      `FSPL = <span class="eq" style="color:var(--accent)">${currentFSPL.toFixed(1)} dB</span> at ${d} km &nbsp;|&nbsp; ` +
      `Received power Pr = <span class="eq" style="color:var(--accent)">${Pr.toFixed(1)} dBm</span>`;
  }

  async function explainDipole() {
    const aiEl = document.getElementById('an2-dp-ai'); aiEl.style.display='block';
    await askAI(`Explain the radiation pattern of a dipole antenna to an ECE student. Cover: 1. Why the pattern is null along the antenna axis and maximum broadside 2. How dipole length (L/λ) affects the pattern shape 3. What "E-plane pattern" means. Be clear and concise.`, aiEl);
  }
  async function explainPathLoss() {
    const aiEl = document.getElementById('an-pl-ai'); aiEl.style.display='block';
    await askAI(`Explain the Friis free-space path loss equation to an ECE student. Cover: 1. Why path loss increases with distance and frequency 2. What antenna gain (Gt, Gr) contributes 3. How this feeds into a basic link budget (Pr = Pt+Gt+Gr-FSPL). Be clear and concise.`, aiEl);
  }

  return { init, onShow, drawDipole, drawPathLoss, explainDipole, explainPathLoss };
})();
