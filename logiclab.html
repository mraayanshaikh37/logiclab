const OpAmpLab = (() => {
  let oaCanvas, oaCtx, adCanvas, adCtx;

  function init() {
    const p = document.getElementById('panel-opamp');
    p.innerHTML = `
      <div class="sec">Op-Amp &amp; Instrumentation</div>

      <div class="card" style="margin-bottom:16px">
        <h4>Op-Amp Amplifier</h4>
        <div class="row">
          <div class="col">
            <label>Configuration</label>
            <select id="oa-cfg" onchange="OpAmpLab.drawAmp()">
              <option value="inv">Inverting</option>
              <option value="noninv">Non-Inverting</option>
            </select>
          </div>
          <div class="col"><label>Rin (kΩ)</label><input type="number" id="oa-rin" value="10" min="0.1" max="1000" step="0.1" oninput="OpAmpLab.drawAmp()"></div>
          <div class="col"><label>Rf (kΩ)</label><input type="number" id="oa-rf" value="47" min="0.1" max="10000" step="0.1" oninput="OpAmpLab.drawAmp()"></div>
        </div>
        <canvas id="opampcanvas" style="margin-top:12px"></canvas>
        <div id="oa-out" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="OpAmpLab.explainAmp()">✨ AI Explain</button>
        <div id="oa-amp-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>

      <div class="card">
        <h4>ADC Quantization</h4>
        <div class="row">
          <div class="col"><label>Resolution (bits)</label><input type="number" id="oa-bits" value="3" min="1" max="8" step="1" oninput="OpAmpLab.drawADC()"></div>
          <div class="col"><label>Full-scale Range (V)</label><input type="number" id="oa-vfs" value="5" min="1" max="20" step="0.5" oninput="OpAmpLab.drawADC()"></div>
        </div>
        <canvas id="adccanvas" style="margin-top:12px"></canvas>
        <div id="oa-adc-out" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="OpAmpLab.explainADC()">✨ AI Explain</button>
        <div id="oa-adc-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>
    `;
    oaCanvas = document.getElementById('opampcanvas'); oaCtx = oaCanvas.getContext('2d');
    oaCanvas.width = oaCanvas.offsetWidth; oaCanvas.height = 220;
    adCanvas = document.getElementById('adccanvas'); adCtx = adCanvas.getContext('2d');
    adCanvas.width = adCanvas.offsetWidth; adCanvas.height = 220;
    drawAmp(); drawADC();
  }

  function onShow() {
    if (oaCanvas) { oaCanvas.width = oaCanvas.offsetWidth; drawAmp(); }
    if (adCanvas) { adCanvas.width = adCanvas.offsetWidth; drawADC(); }
  }

  function drawAmp() {
    if (!oaCanvas || oaCanvas.width < 10) return;
    const cfg = document.getElementById('oa-cfg').value;
    const Rin = +document.getElementById('oa-rin').value;
    const Rf = +document.getElementById('oa-rf').value;
    const gain = cfg === 'inv' ? -(Rf/Rin) : (1 + Rf/Rin);
    const W = oaCanvas.width, H = oaCanvas.height;
    oaCtx.clearRect(0,0,W,H);
    const midY = H/2, pw = W-20, ox=10;
    oaCtx.strokeStyle='rgba(255,255,255,0.12)'; oaCtx.lineWidth=1;
    oaCtx.beginPath(); oaCtx.moveTo(ox,midY); oaCtx.lineTo(ox+pw,midY); oaCtx.stroke();

    const vinAmp = H*0.18;
    const voutAmp = Math.min(Math.abs(gain)*vinAmp, H*0.46);
    oaCtx.strokeStyle='#3b82f6'; oaCtx.lineWidth=1.8; oaCtx.beginPath();
    for (let i=0;i<=pw;i++) { const t=i/pw*4*Math.PI; const y=midY - Math.sin(t)*vinAmp; i===0?oaCtx.moveTo(ox+i,y):oaCtx.lineTo(ox+i,y); }
    oaCtx.stroke();
    oaCtx.strokeStyle='#00ff9d'; oaCtx.lineWidth=2; oaCtx.beginPath();
    for (let i=0;i<=pw;i++) { const t=i/pw*4*Math.PI; const y=midY - Math.sign(gain)*Math.sin(t)*voutAmp; i===0?oaCtx.moveTo(ox+i,y):oaCtx.lineTo(ox+i,y); }
    oaCtx.stroke();
    oaCtx.fillStyle='#3b82f6'; oaCtx.font='10px JetBrains Mono'; oaCtx.fillText('Vin', ox+4, midY-vinAmp-6);
    oaCtx.fillStyle='#00ff9d'; oaCtx.fillText('Vout (clipped to scale)', ox+4, midY-voutAmp-6 > 12 ? midY-voutAmp-6 : 12);

    document.getElementById('oa-out').innerHTML =
      `Gain Av = <span class="eq" style="color:var(--accent)">${gain.toFixed(2)}</span> ` +
      `(${cfg==='inv'?'inverted, 180° phase shift':'in phase'})`;
  }

  function drawADC() {
    if (!adCanvas || adCanvas.width < 10) return;
    const bits = +document.getElementById('oa-bits').value;
    const vfs = +document.getElementById('oa-vfs').value;
    const levels = Math.pow(2, bits);
    const step = vfs / levels;
    const W = adCanvas.width, H = adCanvas.height;
    adCtx.clearRect(0,0,W,H);
    const ox=10, oy=H-20, pw=W-20, ph=H-36;
    adCtx.strokeStyle='rgba(255,255,255,0.12)'; adCtx.lineWidth=1;
    adCtx.beginPath(); adCtx.moveTo(ox,oy); adCtx.lineTo(ox+pw,oy); adCtx.stroke();
    // analog sine (0..vfs range, offset to positive)
    adCtx.strokeStyle='#3b82f6'; adCtx.lineWidth=1.5; adCtx.beginPath();
    for (let i=0;i<=pw;i++) {
      const t = i/pw*2*Math.PI;
      const v = vfs/2 + (vfs/2)*Math.sin(t);
      const y = oy - (v/vfs)*ph;
      i===0?adCtx.moveTo(ox+i,y):adCtx.lineTo(ox+i,y);
    }
    adCtx.stroke();
    // quantized staircase
    adCtx.strokeStyle='#00ff9d'; adCtx.lineWidth=2; adCtx.beginPath();
    let prevY = null;
    for (let i=0;i<=pw;i++) {
      const t = i/pw*2*Math.PI;
      const v = vfs/2 + (vfs/2)*Math.sin(t);
      const q = Math.min(Math.floor(v/step)*step + step/2, vfs);
      const y = oy - (q/vfs)*ph;
      if (prevY===null) { adCtx.moveTo(ox+i,y); } else if (Math.abs(y-prevY)>0.5) { adCtx.lineTo(ox+i,prevY); adCtx.lineTo(ox+i,y); } else { adCtx.lineTo(ox+i,y); }
      prevY = y;
    }
    adCtx.stroke();

    document.getElementById('oa-adc-out').innerHTML =
      `${bits}-bit → <span class="eq" style="color:var(--accent)">${levels} levels</span> &nbsp;|&nbsp; ` +
      `Step size (resolution) = <span class="eq" style="color:var(--accent)">${step.toFixed(3)} V</span> &nbsp;|&nbsp; ` +
      `Max quantization error = <span class="eq" style="color:var(--accent)">±${(step/2).toFixed(3)} V</span>`;
  }

  async function explainAmp() {
    const aiEl = document.getElementById('oa-amp-ai'); aiEl.style.display='block';
    const cfg = document.getElementById('oa-cfg').value;
    await askAI(`Explain the ${cfg==='inv'?'inverting':'non-inverting'} op-amp amplifier configuration to an ECE student. Cover: 1. The virtual short/ground concept 2. How the gain formula is derived from Rin and Rf 3. Why this configuration is/isn't inverting. Be clear and concise.`, aiEl);
  }
  async function explainADC() {
    const aiEl = document.getElementById('oa-adc-ai'); aiEl.style.display='block';
    await askAI(`Explain ADC quantization to an ECE student. Cover: 1. Why analog signals must be quantized into discrete levels 2. How bit resolution determines step size and error 3. What quantization error/noise means and how it relates to SNR. Be clear and concise.`, aiEl);
  }

  return { init, onShow, drawAmp, drawADC, explainAmp, explainADC };
})();

/* ══════════════════════════════════════
   POWER ELECTRONICS
══════════════════════════════════════ */
const PowerLab = (() => {
  let rectCanvas, rectCtx, pwmCanvas, pwmCtx;

  function init() {
    const p = document.getElementById('panel-power');
    p.innerHTML = `
      <div class="sec">Power Electronics</div>

      <div class="card" style="margin-bottom:16px">
        <h4>Rectifier Waveforms</h4>
        <div class="row">
          <div class="col">
            <label>Type</label>
            <select id="pw-type" onchange="PowerLab.drawRect()">
              <option value="half">Half-Wave</option>
              <option value="full">Full-Wave (Bridge)</option>
            </select>
          </div>
          <div class="col"><label>Peak AC Voltage (V)</label><input type="number" id="pw-vp" value="12" min="1" max="240" step="1" oninput="PowerLab.drawRect()"></div>
          <div class="col"><label>Smoothing (0=none, 1=heavy cap)</label><input type="number" id="pw-smooth" value="0" min="0" max="1" step="0.05" oninput="PowerLab.drawRect()"></div>
        </div>
        <canvas id="rectifiercanvas" style="margin-top:12px"></canvas>
        <div id="pw-rect-out" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="PowerLab.explainRect()">✨ AI Explain</button>
        <div id="pw-rect-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>

      <div class="card">
        <h4>PWM Duty Cycle</h4>
        <div class="row">
          <div class="col"><label>Duty Cycle (%)</label><input type="number" id="pw-duty" value="35" min="0" max="100" step="1" oninput="PowerLab.drawPWM()"></div>
          <div class="col"><label>Supply Vcc (V)</label><input type="number" id="pw-vcc" value="12" min="1" max="48" step="1" oninput="PowerLab.drawPWM()"></div>
        </div>
        <canvas id="pwmcanvas" style="margin-top:12px"></canvas>
        <div id="pw-pwm-out" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="PowerLab.explainPWM()">✨ AI Explain</button>
        <div id="pw-pwm-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>
    `;
    rectCanvas = document.getElementById('rectifiercanvas'); rectCtx = rectCanvas.getContext('2d');
    rectCanvas.width = rectCanvas.offsetWidth; rectCanvas.height = 220;
    pwmCanvas = document.getElementById('pwmcanvas'); pwmCtx = pwmCanvas.getContext('2d');
    pwmCanvas.width = pwmCanvas.offsetWidth; pwmCanvas.height = 200;
    drawRect(); drawPWM();
  }

  function onShow() {
    if (rectCanvas) { rectCanvas.width = rectCanvas.offsetWidth; drawRect(); }
    if (pwmCanvas) { pwmCanvas.width = pwmCanvas.offsetWidth; drawPWM(); }
  }

  function drawRect() {
    if (!rectCanvas || rectCanvas.width < 10) return;
    const type = document.getElementById('pw-type').value;
    const Vp = +document.getElementById('pw-vp').value;
    const smooth = +document.getElementById('pw-smooth').value;
    const W = rectCanvas.width, H = rectCanvas.height;
    rectCtx.clearRect(0,0,W,H);
    const ox=10, oy=H-20, pw=W-20, ph=H-40, midY=oy-ph*0.5;

    rectCtx.strokeStyle='rgba(255,255,255,0.12)'; rectCtx.lineWidth=1;
    rectCtx.beginPath(); rectCtx.moveTo(ox,midY); rectCtx.lineTo(ox+pw,midY); rectCtx.stroke();

    // input AC (light, faded)
    rectCtx.strokeStyle='rgba(59,130,246,0.5)'; rectCtx.lineWidth=1.5; rectCtx.beginPath();
    for (let i=0;i<=pw;i++) { const t=i/pw*4*Math.PI; const y=midY - Math.sin(t)*(ph*0.4); i===0?rectCtx.moveTo(ox+i,y):rectCtx.lineTo(ox+i,y); }
    rectCtx.stroke();

    // rectified + smoothed output
    let lastPeak = 0;
    rectCtx.strokeStyle='#00ff9d'; rectCtx.lineWidth=2; rectCtx.beginPath();
    for (let i=0;i<=pw;i++) {
      const t = i/pw*4*Math.PI;
      const s = Math.sin(t);
      let rect;
      if (type === 'half') rect = Math.max(s,0);
      else rect = Math.abs(s);
      // simple smoothing: blend toward the local peak envelope based on `smooth`
      if (rect >= lastPeak) lastPeak = rect; else lastPeak = lastPeak - (1-smooth)*0.05;
      const val = smooth > 0 ? (rect*(1-smooth) + lastPeak*smooth) : rect;
      const y = oy - val*ph;
      i===0?rectCtx.moveTo(ox+i,y):rectCtx.lineTo(ox+i,y);
    }
    rectCtx.stroke();

    const vavg = type==='half' ? Vp/Math.PI : 2*Vp/Math.PI;
    const vrms = type==='half' ? Vp/2 : Vp/Math.sqrt(2);
    document.getElementById('pw-rect-out').innerHTML =
      `Avg (DC) output ≈ <span class="eq" style="color:var(--accent)">${vavg.toFixed(2)} V</span> &nbsp;|&nbsp; ` +
      `RMS ≈ <span class="eq" style="color:var(--accent)">${vrms.toFixed(2)} V</span> &nbsp;|&nbsp; ` +
      `Ripple frequency: <span class="eq" style="color:var(--accent)">${type==='half'?'1×':'2×'} line freq</span>`;
  }

  function drawPWM() {
    if (!pwmCanvas || pwmCanvas.width < 10) return;
    const duty = +document.getElementById('pw-duty').value / 100;
    const vcc = +document.getElementById('pw-vcc').value;
    const W = pwmCanvas.width, H = pwmCanvas.height;
    pwmCtx.clearRect(0,0,W,H);
    const ox=10, oy=H-20, pw=W-20, ph=H-40;
    const cycles = 4;
    pwmCtx.strokeStyle='rgba(255,255,255,0.12)'; pwmCtx.lineWidth=1;
    pwmCtx.beginPath(); pwmCtx.moveTo(ox,oy); pwmCtx.lineTo(ox+pw,oy); pwmCtx.stroke();

    pwmCtx.strokeStyle='#00ff9d'; pwmCtx.lineWidth=2; pwmCtx.beginPath();
    const cw = pw/cycles;
    for (let c=0;c<cycles;c++) {
      const x0 = ox + c*cw, xHigh = x0 + cw*duty, x1 = x0 + cw;
      pwmCtx.moveTo(x0, oy); pwmCtx.lineTo(x0, oy-ph);
      pwmCtx.lineTo(xHigh, oy-ph); pwmCtx.lineTo(xHigh, oy);
      pwmCtx.lineTo(x1, oy);
    }
    pwmCtx.stroke();

    const avg = vcc*duty;
    const avgY = oy - (avg/vcc)*ph;
    pwmCtx.strokeStyle='rgba(245,158,11,0.7)'; pwmCtx.setLineDash([5,4]); pwmCtx.lineWidth=1.5;
    pwmCtx.beginPath(); pwmCtx.moveTo(ox,avgY); pwmCtx.lineTo(ox+pw,avgY); pwmCtx.stroke();
    pwmCtx.setLineDash([]);

    document.getElementById('pw-pwm-out').innerHTML =
      `Duty cycle = <span class="eq" style="color:var(--accent)">${(duty*100).toFixed(0)}%</span> &nbsp;|&nbsp; ` +
      `Average (effective DC) output ≈ <span class="eq" style="color:var(--accent)">${avg.toFixed(2)} V</span>`;
  }

  async function explainRect() {
    const aiEl = document.getElementById('pw-rect-ai'); aiEl.style.display='block';
    const type = document.getElementById('pw-type').value;
    await askAI(`Explain the ${type==='half'?'half-wave':'full-wave bridge'} rectifier to an ECE student. Cover: 1. How the diode(s) convert AC to pulsating DC 2. What ripple is and how a smoothing capacitor reduces it 3. Why full-wave has twice the ripple frequency of half-wave. Be clear and concise.`, aiEl);
  }
  async function explainPWM() {
    const aiEl = document.getElementById('pw-pwm-ai'); aiEl.style.display='block';
    await askAI(`Explain Pulse Width Modulation (PWM) to an ECE student. Cover: 1. How varying duty cycle controls average delivered power/voltage 2. Why PWM is efficient compared to linear voltage control 3. One real application (motor speed control, LED dimming, etc). Be clear and concise.`, aiEl);
  }

  return { init, onShow, drawRect, drawPWM, explainRect, explainPWM };
})();

/* ══════════════════════════════════════
   OPTICAL COMMUNICATION
══════════════════════════════════════ */
const OpticalLab = (() => {
  let flCanvas, flCtx;

  function init() {
    const p = document.getElementById('panel-optical');
    p.innerHTML = `
      <div class="sec">Optical Communication</div>

      <div class="card" style="margin-bottom:16px">
        <h4>Fiber Numerical Aperture &amp; Acceptance Angle</h4>
        <div class="row">
          <div class="col"><label>Core index n1</label><input type="number" id="op-n1" value="1.48" min="1.2" max="2" step="0.001" oninput="OpticalLab.calc()"></div>
          <div class="col"><label>Cladding index n2</label><input type="number" id="op-n2" value="1.46" min="1.1" max="1.99" step="0.001" oninput="OpticalLab.calc()"></div>
        </div>
        <div id="op-na-out" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:12px;line-height:1.8"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="OpticalLab.explainNA()">✨ AI Explain</button>
        <div id="op-na-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>

      <div class="card">
        <h4>Fiber Attenuation vs Distance</h4>
        <div class="row">
          <div class="col"><label>Input Power (dBm)</label><input type="number" id="op-pin" value="0" min="-20" max="20" step="0.5" oninput="OpticalLab.calc()"></div>
          <div class="col"><label>Attenuation (dB/km)</label><input type="number" id="op-atten" value="0.25" min="0.01" max="10" step="0.01" oninput="OpticalLab.calc()"></div>
          <div class="col"><label>Length (km)</label><input type="number" id="op-len" value="40" min="0" max="200" step="1" oninput="OpticalLab.calc()"></div>
        </div>
        <canvas id="fiberlosscanvas" style="margin-top:12px"></canvas>
        <div id="op-loss-out" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="OpticalLab.explainLoss()">✨ AI Explain</button>
        <div id="op-loss-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>
    `;
    flCanvas = document.getElementById('fiberlosscanvas'); flCtx = flCanvas.getContext('2d');
    flCanvas.width = flCanvas.offsetWidth; flCanvas.height = 220;
    calc();
  }

  function onShow() {
    if (flCanvas) { flCanvas.width = flCanvas.offsetWidth; calc(); }
  }

  function calc() {
    const n1 = +document.getElementById('op-n1').value;
    const n2 = +document.getElementById('op-n2').value;
    const NA = Math.sqrt(Math.max(n1*n1 - n2*n2, 0));
    const acceptAngle = Math.asin(NA) * 180/Math.PI;
    document.getElementById('op-na-out').innerHTML =
      `Numerical Aperture NA = <span class="eq" style="color:var(--accent)">${NA.toFixed(4)}</span> &nbsp;|&nbsp; ` +
      `Acceptance angle ≈ <span class="eq" style="color:var(--accent)">${acceptAngle.toFixed(2)}°</span>`;

    const Pin = +document.getElementById('op-pin').value;
    const atten = +document.getElementById('op-atten').value;
    const len = +document.getElementById('op-len').value;
    const lossDb = atten * len;
    const Pout = Pin - lossDb;

    if (flCanvas && flCanvas.width >= 10) {
      const W = flCanvas.width, H = flCanvas.height;
      flCtx.clearRect(0,0,W,H);
      const ox=44, oy=H-26, pw=Math.max(W-60,10), ph=H-46;
      flCtx.strokeStyle='rgba(255,255,255,0.12)'; flCtx.lineWidth=1;
      flCtx.beginPath(); flCtx.moveTo(ox,oy); flCtx.lineTo(ox+pw,oy); flCtx.stroke();
      flCtx.beginPath(); flCtx.moveTo(ox,oy); flCtx.lineTo(ox,oy-ph); flCtx.stroke();
      flCtx.fillStyle='#6b6b80'; flCtx.font='10px JetBrains Mono';
      flCtx.fillText('distance (km)', ox+pw-60, oy+18); flCtx.fillText('Power (dBm)', ox-38, oy-ph-4);

      const maxLen = Math.max(len, 10) * 1.2;
      const pMax = Pin + 2, pMin = Pin - atten*maxLen - 2;
      flCtx.strokeStyle='#00ff9d'; flCtx.lineWidth=2; flCtx.beginPath();
      for (let i=0;i<=pw;i++) {
        const dv = (i/pw)*maxLen;
        const pv = Pin - atten*dv;
        const y = oy - ((pv-pMin)/(pMax-pMin))*ph;
        i===0?flCtx.moveTo(ox+i,y):flCtx.lineTo(ox+i,y);
      }
      flCtx.stroke();
      const curX = ox + (len/maxLen)*pw;
      const curY = oy - ((Pout-pMin)/(pMax-pMin))*ph;
      flCtx.fillStyle='#f59e0b'; flCtx.beginPath(); flCtx.arc(curX,curY,5,0,2*Math.PI); flCtx.fill();
    }

    document.getElementById('op-loss-out').innerHTML =
      `Total loss = <span class="eq" style="color:var(--accent)">${lossDb.toFixed(2)} dB</span> over ${len} km &nbsp;|&nbsp; ` +
      `Received power = <span class="eq" style="color:var(--accent)">${Pout.toFixed(2)} dBm</span>`;
  }

  async function explainNA() {
    const aiEl = document.getElementById('op-na-ai'); aiEl.style.display='block';
    await askAI(`Explain numerical aperture (NA) and acceptance angle in optical fiber to an ECE student. Cover: 1. Why core/cladding index difference determines NA 2. What the acceptance angle physically means (total internal reflection) 3. How NA relates to how much light the fiber can couple in. Be clear and concise.`, aiEl);
  }
  async function explainLoss() {
    const aiEl = document.getElementById('op-loss-ai'); aiEl.style.display='block';
    await askAI(`Explain fiber optic attenuation (loss in dB/km) to an ECE student. Cover: 1. Main causes of attenuation (absorption, scattering, bending) 2. Why loss is expressed logarithmically (dB) 3. How this determines maximum unrepeated link distance. Be clear and concise.`, aiEl);
  }

  return { init, onShow, calc, explainNA, explainLoss };
})();

/* ══════════════════════════════════════
   SEQUENTIAL LOGIC — Flip-Flops, Counters, Shift Registers
══════════════════════════════════════ */
const SeqLab = (() => {
  let shiftBits = [0,0,0,0];
  let ringBits = [1,0,0,0];
  let johnsonBits = [0,0,0,0];

  function init() {
    const p = document.getElementById('panel-seq');
    p.innerHTML = `
      <div class="sec">Shift Registers &amp; Ring/Johnson Counters</div>
      <div class="hint"><b>Note</b><br>Basic flip-flops and binary up/down/ring counters live in the Digital Design tab —
        this tab covers shift registers plus the Ring and Johnson counter variants.</div>

      <div class="card" style="margin-bottom:16px">
        <h4>Shift Register (4-bit, SISO/PIPO)</h4>
        <div class="row">
          <div class="col"><label>Serial Input Bit</label><input type="number" id="sr-in" min="0" max="1" value="1"></div>
          <div class="col" style="flex:2">
            <label>&nbsp;</label>
            <div class="row" style="margin:0">
              <button class="btn btn-g" onclick="SeqLab.shiftLeft()">⏭ Shift In (Serial)</button>
              <button class="btn btn-g" onclick="SeqLab.resetShift()">⟳ Reset</button>
            </div>
          </div>
        </div>
        <div class="row" style="margin-top:8px">
          <div class="col" style="flex:3"><label>Parallel Load (4 bits, e.g. 1011)</label><input type="text" id="sr-parallel" maxlength="4" value="1011"></div>
          <div class="col">
            <label>&nbsp;</label>
            <button class="btn btn-g" onclick="SeqLab.loadParallel()">⬇ Parallel Load</button>
          </div>
        </div>
        <div id="shift-leds" style="margin-top:14px;display:flex;gap:8px"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="SeqLab.explainShift()">✨ AI Explain</button>
        <div id="seq-shift-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>

      <div class="card">
        <h4>Ring &amp; Johnson Counters (4-bit)</h4>
        <div class="row">
          <button class="btn btn-g" onclick="SeqLab.clockRing()">⏱ Clock Ring Counter</button>
          <button class="btn btn-g" onclick="SeqLab.resetRing()">⟳ Reset</button>
        </div>
        <div id="ring-leds" style="margin-top:10px;display:flex;gap:8px"></div>
        <div class="row" style="margin-top:16px">
          <button class="btn btn-g" onclick="SeqLab.clockJohnson()">⏱ Clock Johnson Counter</button>
          <button class="btn btn-g" onclick="SeqLab.resetJohnson()">⟳ Reset</button>
        </div>
        <div id="johnson-leds" style="margin-top:10px;display:flex;gap:8px"></div>
        <div id="seq-cnt-out" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="SeqLab.explainCounter()">✨ AI Explain</button>
        <div id="seq-cnt-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>
    `;
    resetShift(); resetRing(); resetJohnson();
  }

  function onShow() {}

  function led(bit, label) {
    return `<div style="width:44px;text-align:center">
      <div style="width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;
        font-family:var(--mono);font-size:16px;font-weight:700;
        background:${bit?'rgba(0,255,157,0.15)':'var(--s2)'};border:1px solid ${bit?'var(--accent)':'var(--border)'};
        color:${bit?'var(--accent)':'var(--muted)'}">${bit}</div>
      ${label?`<div style="font-size:9px;color:var(--muted);margin-top:4px">${label}</div>`:''}
    </div>`;
  }

  function resetShift() { shiftBits = [0,0,0,0]; renderShift(); }
  function shiftLeft() {
    const inBit = (+document.getElementById('sr-in').value) & 1;
    shiftBits = [...shiftBits.slice(1), inBit];
    renderShift();
  }
  function loadParallel() {
    const raw = document.getElementById('sr-parallel').value.replace(/[^01]/g,'').padStart(4,'0').slice(-4);
    shiftBits = raw.split('').map(Number);
    renderShift();
  }
  function renderShift() {
    document.getElementById('shift-leds').innerHTML = shiftBits.map((b,i)=>led(b, i===0?'MSB':(i===3?'LSB':''))).join('');
  }

  function resetRing() { ringBits = [1,0,0,0]; renderCounters(); }
  function clockRing() { ringBits.unshift(ringBits.pop()); renderCounters(); }
  function resetJohnson() { johnsonBits = [0,0,0,0]; renderCounters(); }
  function clockJohnson() {
    const msbIn = johnsonBits[3] ? 0 : 1;
    johnsonBits = [msbIn, ...johnsonBits.slice(0,3)];
    renderCounters();
  }
  function renderCounters() {
    document.getElementById('ring-leds').innerHTML = ringBits.map((b,i)=>led(b,'b'+(3-i))).join('');
    document.getElementById('johnson-leds').innerHTML = johnsonBits.map((b,i)=>led(b,'b'+(3-i))).join('');
    document.getElementById('seq-cnt-out').innerHTML =
      `Ring: <span class="eq" style="color:var(--accent)">${ringBits.join('')}</span> (single 1 rotates, period = N) &nbsp;|&nbsp; ` +
      `Johnson: <span class="eq" style="color:var(--accent)">${johnsonBits.join('')}</span> (inverted feedback, period = 2N)`;
  }

  async function explainShift() {
    const aiEl = document.getElementById('seq-shift-ai'); aiEl.style.display='block';
    await askAI(`Explain shift registers (SISO, SIPO, PISO, PIPO) to an ECE student. Cover: 1. What "shift" means at the flip-flop level 2. The difference between serial and parallel load/output 3. One practical application (e.g., serial-to-parallel conversion). Be clear and concise.`, aiEl);
  }
  async function explainCounter() {
    const aiEl = document.getElementById('seq-cnt-ai'); aiEl.style.display='block';
    await askAI(`Explain Ring counters and Johnson (twisted-ring) counters built from shift registers, to an ECE student. Cover: 1. How each is wired (feedback connection) 2. Why Ring counter has period N and Johnson counter has period 2N for N flip-flops 3. One practical use case for each. Be clear and concise.`, aiEl);
  }

  return { init, onShow, resetShift, shiftLeft, loadParallel,
    resetRing, clockRing, resetJohnson, clockJohnson, explainShift, explainCounter };
})();

/* ══════════════════════════════════════
   FSM DESIGNER — "101" Sequence Detector
══════════════════════════════════════ */
const FSMLab = (() => {
  let fCanvas, fCtx;
  let curState = 'S0', outputLog = '', inputPos = 0;

  // Moore: 4 states, output attached to state. Overlap allowed.
  const MOORE = {
    states: ['S0','S1','S2','S3'],
    out: {S0:0,S1:0,S2:0,S3:1},
    trans: { S0:{0:'S0',1:'S1'}, S1:{0:'S2',1:'S1'}, S2:{0:'S0',1:'S3'}, S3:{0:'S2',1:'S1'} },
    pos: {S0:[60,130], S1:[160,60], S2:[260,130], S3:[160,200]},
  };
  // Mealy: 3 states, output on transition.
  const MEALY = {
    states: ['S0','S1','S2'],
    trans: { S0:{0:['S0',0],1:['S1',0]}, S1:{0:['S2',0],1:['S1',0]}, S2:{0:['S0',0],1:['S1',1]} },
    pos: {S0:[70,130], S1:[190,60], S2:[190,200]},
  };

  function init() {
    const p = document.getElementById('panel-fsm');
    p.innerHTML = `
      <div class="sec">FSM Designer — "101" Sequence Detector (overlap allowed)</div>
      <div class="hint"><b>What this shows</b><br>A classic finite state machine that detects the bit pattern "101" in an incoming stream.
        Switch between Moore (output tied to state) and Mealy (output tied to transition) styles for the same detector.</div>

      <div class="card">
        <div class="row">
          <div class="col">
            <label>FSM Style</label>
            <select id="fsm-style" onchange="FSMLab.reset()">
              <option value="moore">Moore</option>
              <option value="mealy">Mealy</option>
            </select>
          </div>
          <div class="col" style="flex:2"><label>Input Bit Stream</label><input type="text" id="fsm-input" value="1011010100101" maxlength="24"></div>
        </div>
        <div class="row" style="margin-top:8px">
          <button class="btn btn-g" onclick="FSMLab.step()">⏭ Step One Bit</button>
          <button class="btn btn-g" onclick="FSMLab.runAll()">▶ Run All</button>
          <button class="btn btn-g" onclick="FSMLab.reset()">⟳ Reset</button>
        </div>
        <canvas id="fsmcanvas" style="margin-top:12px"></canvas>
        <div id="fsm-out" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px;line-height:1.8"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="FSMLab.explain()">✨ AI Explain</button>
        <div id="fsm-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>
    `;
    fCanvas = document.getElementById('fsmcanvas'); fCtx = fCanvas.getContext('2d');
    fCanvas.width = fCanvas.offsetWidth; fCanvas.height = 260;
    reset();
  }

  function onShow() { if (fCanvas) { fCanvas.width = fCanvas.offsetWidth; draw(); } }

  function machine() { return document.getElementById('fsm-style').value === 'moore' ? MOORE : MEALY; }

  function reset() {
    const m = machine();
    curState = m.states[0]; outputLog = ''; inputPos = 0;
    draw();
    document.getElementById('fsm-out').innerHTML = `Current state: <span class="eq" style="color:var(--accent)">${curState}</span>`;
  }

  function step() {
    const m = machine();
    const bits = document.getElementById('fsm-input').value.replace(/[^01]/g,'');
    if (inputPos >= bits.length) return;
    const bit = +bits[inputPos];
    let out;
    if (document.getElementById('fsm-style').value === 'moore') {
      curState = m.trans[curState][bit];
      out = m.out[curState];
    } else {
      const [next, o] = m.trans[curState][bit];
      curState = next; out = o;
    }
    outputLog += out;
    inputPos++;
    draw();
    document.getElementById('fsm-out').innerHTML =
      `Bit read: <span class="eq" style="color:var(--accent)">${bit}</span> (position ${inputPos}) &nbsp;|&nbsp; ` +
      `New state: <span class="eq" style="color:var(--accent)">${curState}</span> &nbsp;|&nbsp; Output: <span class="eq" style="color:var(--accent)">${out}</span><br>` +
      `Output sequence so far: <span class="eq" style="color:var(--accent)">${outputLog || '(none)'}</span>`;
  }

  function runAll() {
    const bits = document.getElementById('fsm-input').value.replace(/[^01]/g,'');
    reset();
    for (let i = 0; i < bits.length; i++) step();
  }

  function draw() {
    if (!fCanvas || fCanvas.width < 10) return;
    const m = machine();
    const W = fCanvas.width, H = fCanvas.height;
    fCtx.clearRect(0,0,W,H);
    const scaleX = W / 320;
    // draw edges first
    fCtx.font = '10px JetBrains Mono';
    m.states.forEach(s => {
      const t = m.trans[s];
      Object.keys(t).forEach(bit => {
        const target = Array.isArray(t[bit]) ? t[bit][0] : t[bit];
        const [x0,y0] = m.pos[s], [x1,y1] = m.pos[target];
        const sx0=x0*scaleX, sy0=y0, sx1=x1*scaleX, sy1=y1;
        fCtx.strokeStyle = 'rgba(255,255,255,0.25)'; fCtx.lineWidth=1.2;
        if (s === target) {
          fCtx.beginPath(); fCtx.arc(sx0, sy0-30, 16, 0, 2*Math.PI); fCtx.stroke();
          fCtx.fillStyle='#6b6b80'; fCtx.fillText(bit, sx0-3, sy0-50);
        } else {
          fCtx.beginPath(); fCtx.moveTo(sx0,sy0); fCtx.lineTo(sx1,sy1); fCtx.stroke();
          fCtx.fillStyle='#6b6b80'; fCtx.fillText(bit, (sx0+sx1)/2, (sy0+sy1)/2 - 6);
        }
      });
    });
    // draw nodes
    m.states.forEach(s => {
      const [x,y] = m.pos[s]; const sx=x*scaleX;
      const active = s === curState;
      fCtx.fillStyle = active ? '#00ff9d' : '#1a1a22';
      fCtx.strokeStyle = active ? '#00ff9d' : '#3a3a45'; fCtx.lineWidth=2;
      fCtx.beginPath(); fCtx.arc(sx,y,22,0,2*Math.PI); fCtx.fill(); fCtx.stroke();
      fCtx.fillStyle = active ? '#04140d' : '#c8c8d4'; fCtx.font='12px JetBrains Mono';
      const label = m.out ? `${s}${m.out[s]?'/1':''}` : s;
      fCtx.fillText(label, sx-16, y+4);
    });
  }

  async function explain() {
    const aiEl = document.getElementById('fsm-ai'); aiEl.style.display='block';
    const style = document.getElementById('fsm-style').value;
    await askAI(`Explain how a ${style} finite state machine detects the pattern "101" in a bitstream, to an ECE student. Cover: 1. What each state represents (how much of the pattern has been matched so far) 2. Why the machine needs to handle overlapping matches (e.g. "1011010" contains overlapping "101"s) 3. Key difference between Moore (output = f(state)) and Mealy (output = f(state, input)) machines. Be clear and concise.`, aiEl);
  }

  return { init, onShow, reset, step, runAll, explain };
})();

const FabLab = (() => {
  const STEPS = [
    {n:1, name:'Wafer Preparation',   desc:'Silicon ingot is grown (Czochralski process), sliced into thin wafers, and polished to a mirror finish.'},
    {n:2, name:'Oxidation',           desc:'Wafer surface is heated in oxygen/steam to grow a thin, precise SiO₂ insulating layer.'},
    {n:3, name:'Photolithography',    desc:'Photoresist is coated, exposed through a mask with UV light, and developed to pattern the circuit geometry.'},
    {n:4, name:'Etching',             desc:'Unwanted material is removed (wet or plasma/dry etch) following the photoresist pattern.'},
    {n:5, name:'Ion Implantation / Doping', desc:'Dopant ions (boron, phosphorus, etc.) are implanted to create n-type/p-type regions.'},
    {n:6, name:'Deposition (CVD/PVD)',desc:'Thin films (polysilicon, metal, dielectric) are deposited via chemical or physical vapor deposition.'},
    {n:7, name:'Metallization',       desc:'Metal interconnect layers are deposited and patterned to wire transistors together.'},
    {n:8, name:'Packaging & Testing', desc:'Wafer is diced into dies, each die is packaged, wire-bonded, and electrically tested.'},
  ];

  function init() {
    const p = document.getElementById('panel-fab');
    p.innerHTML = `
      <div class="sec">VLSI Fabrication &amp; Technology Scaling</div>

      <div class="card" style="margin-bottom:16px">
        <h4>Fabrication Process Flow</h4>
        <div id="fab-steps"></div>
      </div>

      <div class="card">
        <h4>Technology Scaling Calculator (Constant-Field / Dennard Scaling)</h4>
        <div class="row">
          <div class="col"><label>Scaling factor S (&gt;1, e.g. 1.4 per node)</label><input type="number" id="fab-s" value="1.4" min="1.01" max="4" step="0.05" oninput="FabLab.calc()"></div>
        </div>
        <div class="row">
          <div class="col"><label>Old Gate Length L (nm)</label><input type="number" id="fab-l" value="90" min="1" max="1000" step="1" oninput="FabLab.calc()"></div>
          <div class="col"><label>Old VDD (V)</label><input type="number" id="fab-vdd" value="1.2" min="0.1" max="12" step="0.1" oninput="FabLab.calc()"></div>
        </div>
        <div id="fab-scale-out" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:14px;line-height:2"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="FabLab.explain()">✨ AI Explain</button>
        <div id="fab-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>
    `;
    const list = document.getElementById('fab-steps');
    STEPS.forEach(s => {
      const row = document.createElement('div');
      row.style.cssText = 'border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden;cursor:pointer';
      row.innerHTML = `
        <div style="padding:10px 14px;display:flex;gap:10px;align-items:center;background:var(--s2)">
          <span style="font-family:var(--mono);font-weight:700;color:var(--accent)">${s.n}</span>
          <span style="font-weight:600">${s.name}</span>
        </div>
        <div class="fab-desc" style="display:none;padding:10px 14px;font-size:12.5px;color:var(--muted);line-height:1.7">${s.desc}</div>
      `;
      row.onclick = () => { const d = row.querySelector('.fab-desc'); d.style.display = d.style.display==='none'?'block':'none'; };
      list.appendChild(row);
    });
    calc();
  }

  function onShow() {}

  function calc() {
    const S = +document.getElementById('fab-s').value;
    const L = +document.getElementById('fab-l').value;
    const VDD = +document.getElementById('fab-vdd').value;
    const Lnew = L/S, VDDnew = VDD/S;
    const areaFactor = 1/(S*S), delayFactor = 1/S, powerFactor = 1/(S*S), densityFactor = 1;
    document.getElementById('fab-scale-out').innerHTML =
      `Gate length: ${L} nm → <span class="eq" style="color:var(--accent)">${Lnew.toFixed(1)} nm</span><br>` +
      `VDD: ${VDD} V → <span class="eq" style="color:var(--accent)">${VDDnew.toFixed(2)} V</span><br>` +
      `Area per device → <span class="eq" style="color:var(--accent)">×${areaFactor.toFixed(3)}</span> (1/S²)<br>` +
      `Gate delay → <span class="eq" style="color:var(--accent)">×${delayFactor.toFixed(3)}</span> (1/S, faster)<br>` +
      `Power per device → <span class="eq" style="color:var(--accent)">×${powerFactor.toFixed(3)}</span> (1/S²)<br>` +
      `Power density → <span class="eq" style="color:var(--accent)">≈ constant</span> (the core promise of Dennard scaling)`;
  }

  async function explain() {
    const aiEl = document.getElementById('fab-ai'); aiEl.style.display='block';
    await askAI(`Explain constant-field (Dennard) technology scaling in VLSI to an ECE student. Cover: 1. What scaling factor S represents when shrinking a process node 2. Why area, delay, and power all improve predictably with S 3. Why power density staying roughly constant was the key benefit historically 4. Briefly, why Dennard scaling broke down in the mid-2000s (leakage current). Be clear and concise.`, aiEl);
  }

  return { init, onShow, calc, explain };
})();

          <div class="col"><label>Decimal digits (0-9 each)</label><input type="text" id="ns-bcd" maxlength="6" value="905" oninput="NumSys.toBCD()"></div>
        </div>
        <div id="ns-bcd-out" style="font-family:var(--mono);font-size:13px;margin-top:10px;line-height:2"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="NumSys.explainBCD()">✨ AI Explain</button>
        <div id="ns-bcd-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>
    `;
    convert(); fromBinary(); toBCD();
  }
  function onShow() {}

  function convert() {
    const raw = document.getElementById('ns-val').value.trim();
    const base = +document.getElementById('ns-base').value;
    const val = parseInt(raw, base);
    if (isNaN(val) || val < 0) {
      document.getElementById('ns-out').innerHTML = `<span style="color:var(--red)">Invalid digits for base ${base}</span>`;
      return;
    }
    document.getElementById('ns-out').innerHTML =
      `Decimal: <span class="eq" style="color:var(--accent)">${val.toString(10)}</span><br>` +
      `Binary: <span class="eq" style="color:var(--accent)">${val.toString(2)}</span><br>` +
      `Octal: <span class="eq" style="color:var(--accent)">${val.toString(8)}</span><br>` +
      `Hexadecimal: <span class="eq" style="color:var(--accent)">${val.toString(16).toUpperCase()}</span>`;
  }

  function binToGray(bin) {
    let gray = bin[0];
    for (let i = 1; i < bin.length; i++) gray += (bin[i-1] ^ bin[i]) ? '1' : '0';
    return gray;
  }
  function grayToBin(gray) {
    let bin = gray[0];
    for (let i = 1; i < gray.length; i++) bin += ((+bin[i-1]) ^ (+gray[i])) ? '1' : '0';
    return bin;
  }
  function fromBinary() {
    const raw = document.getElementById('ns-bin').value.replace(/[^01]/g,'');
    if (!raw) return;
    document.getElementById('ns-gray').value = binToGray(raw);
    document.getElementById('ns-gray-out').innerHTML = `Binary <span class="eq" style="color:var(--accent)">${raw}</span> → Gray <span class="eq" style="color:var(--accent)">${binToGray(raw)}</span>`;
  }
  function fromGray() {
    const raw = document.getElementById('ns-gray').value.replace(/[^01]/g,'');
    if (!raw) return;
    document.getElementById('ns-bin').value = grayToBin(raw);
    document.getElementById('ns-gray-out').innerHTML = `Gray <span class="eq" style="color:var(--accent)">${raw}</span> → Binary <span class="eq" style="color:var(--accent)">${grayToBin(raw)}</span>`;
  }

  function toBCD() {
    const raw = document.getElementById('ns-bcd').value.replace(/[^0-9]/g,'');
    if (!raw) { document.getElementById('ns-bcd-out').innerHTML = ''; return; }
    const bcd = raw.split('').map(d => (+d).toString(2).padStart(4,'0'));
    document.getElementById('ns-bcd-out').innerHTML =
      `Decimal: <span class="eq" style="color:var(--accent)">${raw}</span><br>` +
      `BCD: <span class="eq" style="color:var(--accent)">${bcd.join(' ')}</span> ` +
      `<span style="color:var(--muted)">(4 bits per digit)</span>`;
  }

  async function explainBase() {
    const aiEl = document.getElementById('ns-base-ai'); aiEl.style.display='block';
    await askAI(`Explain number base conversion (decimal, binary, octal, hexadecimal) to an ECE student. Cover: 1. How positional weighting works in each base 2. A quick method for binary↔hex/octal grouping (why 4 bits map to 1 hex digit) 3. Why digital systems use these bases. Be clear and concise.`, aiEl);
  }
  async function explainGray() {
    const aiEl = document.getElementById('ns-gray-ai'); aiEl.style.display='block';
    await askAI(`Explain Gray code to an ECE student. Cover: 1. What makes it different from binary (only one bit changes between consecutive values) 2. Why this property matters (e.g., rotary encoders, K-maps, reducing glitches) 3. The XOR-based conversion rule between binary and Gray code. Be clear and concise.`, aiEl);
  }
  async function explainBCD() {
    const aiEl = document.getElementById('ns-bcd-ai'); aiEl.style.display='block';
    await askAI(`Explain Binary Coded Decimal (BCD) to an ECE student. Cover: 1. Why each decimal digit gets its own 4-bit binary code 2. Why BCD is less efficient than pure binary but still used (e.g., digital displays, calculators) 3. What "invalid" BCD codes are (1010-1111). Be clear and concise.`, aiEl);
  }

  return { init, onShow, convert, fromBinary, fromGray, toBCD, explainBase, explainGray, explainBCD };
})();

/* ══════════════════════════════════════

const ComboLab = (() => {

      <div class="card" style="margin-bottom:16px">
        <h4>4:1 Multiplexer / 1:4 Demultiplexer</h4>
        <div class="row">
          <div class="col"><label>D0</label><input type="number" id="cb-d0" min="0" max="1" value="0" oninput="ComboLab.calcMux()"></div>
          <div class="col"><label>D1</label><input type="number" id="cb-d1" min="0" max="1" value="1" oninput="ComboLab.calcMux()"></div>
          <div class="col"><label>D2</label><input type="number" id="cb-d2" min="0" max="1" value="0" oninput="ComboLab.calcMux()"></div>
          <div class="col"><label>D3</label><input type="number" id="cb-d3" min="0" max="1" value="1" oninput="ComboLab.calcMux()"></div>

        <div class="row">
          <div class="col"><label>Select S1</label><input type="number" id="cb-s1" min="0" max="1" value="1" oninput="ComboLab.calcMux()"></div>
          <div class="col"><label>Select S0</label><input type="number" id="cb-s0" min="0" max="1" value="0" oninput="ComboLab.calcMux()"></div>
          <div class="col" style="flex:2"><label>DEMUX Input Din</label><input type="number" id="cb-din" min="0" max="1" value="1" oninput="ComboLab.calcMux()"></div>
        </div>
        <div id="cb-mux-out" style="font-family:var(--mono);font-size:13px;margin-top:14px;line-height:2"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="ComboLab.explainMux()">✨ AI Explain</button>
        <div id="cb-mux-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>

      <div class="card" style="margin-bottom:16px">
        <h4>8:3 Priority Encoder / 3:8 Decoder</h4>
        <div class="row" style="flex-wrap:wrap">
          ${[0,1,2,3,4,5,6,7].map(i=>`<div class="col" style="flex:0 0 11%"><label>I${i}</label><input type="number" id="cb-enc${i}" min="0" max="1" value="${i===5?1:0}" oninput="ComboLab.calcEncDec()"></div>`).join('')}
        </div>
        <div id="cb-enc-out" style="font-family:var(--mono);font-size:13px;margin-top:12px"></div>
        <div class="row" style="margin-top:14px">
          <div class="col"><label>Decoder Input (3-bit, 0-7)</label><input type="number" id="cb-dec-in" min="0" max="7" value="5" oninput="ComboLab.calcEncDec()"></div>
        </div>
        <div id="cb-dec-out" style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="ComboLab.explainEncDec()">✨ AI Explain</button>
        <div id="cb-encdec-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>

      <div class="card" style="margin-bottom:16px">
        <h4>2-bit Magnitude Comparator</h4>
        <div class="row">
          <div class="col"><label>A (0-3)</label><input type="number" id="cb-cmpa" min="0" max="3" value="2" oninput="ComboLab.calcCompare()"></div>
          <div class="col"><label>B (0-3)</label><input type="number" id="cb-cmpb" min="0" max="3" value="1" oninput="ComboLab.calcCompare()"></div>
        </div>
        <div id="cb-cmp-out" style="font-family:var(--mono);font-size:14px;margin-top:12px"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="ComboLab.explainCompare()">✨ AI Explain</button>
        <div id="cb-cmp-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>

      <div class="card">
        <h4>Parity Generator / Checker</h4>
        <div class="row">
          <div class="col" style="flex:2"><label>Data bits (e.g. 1011001)</label><input type="text" id="cb-par" value="1011001" oninput="ComboLab.calcParity()"></div>
          <div class="col">
            <label>Type</label>
            <select id="cb-par-type" onchange="ComboLab.calcParity()">
              <option value="even">Even Parity</option>
              <option value="odd">Odd Parity</option>
            </select>
          </div>
        </div>
        <div id="cb-par-out" style="font-family:var(--mono);font-size:13px;margin-top:12px;line-height:1.9"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="ComboLab.explainParity()">✨ AI Explain</button>
        <div id="cb-par-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>
    `;
    calcAdder(); calcMux(); calcEncDec(); calcCompare(); calcParity();
  }
  function onShow() {}

  function calcAdder() {
    const type = document.getElementById('cb-adder-type').value;
    const A = (+document.getElementById('cb-a1').value)&1, B=(+document.getElementById('cb-b1').value)&1;
    document.getElementById('cb-cin-col').style.display = (type==='fa'||type==='fs') ? '' : 'none';
    const Cin = (+document.getElementById('cb-c1').value)&1;
    let out;
    if (type==='ha') { const S=A^B, C=A&B; out=`Sum = <span class="eq" style="color:var(--accent)">${S}</span> &nbsp;|&nbsp; Carry = <span class="eq" style="color:var(--accent)">${C}</span>`; }
    else if (type==='fa') { const S=A^B^Cin, C=(A&B)|(B&Cin)|(A&Cin); out=`Sum = <span class="eq" style="color:var(--accent)">${S}</span> &nbsp;|&nbsp; Cout = <span class="eq" style="color:var(--accent)">${C}</span>`; }
    else if (type==='hs') { const D=A^B, Bo=(~A&1)&B; out=`Diff = <span class="eq" style="color:var(--accent)">${D}</span> &nbsp;|&nbsp; Borrow = <span class="eq" style="color:var(--accent)">${Bo}</span>`; }
    else { const D=A^B^Cin, Bo=((~A&1)&B)|((~A&1)&Cin)|(B&Cin); out=`Diff = <span class="eq" style="color:var(--accent)">${D}</span> &nbsp;|&nbsp; Bout = <span class="eq" style="color:var(--accent)">${Bo}</span>`; }
    document.getElementById('cb-adder-out').innerHTML = out;
  }

  function calcMux() {
    const D=[0,1,2,3].map(i=>(+document.getElementById('cb-d'+i).value)&1);
    const S1=(+document.getElementById('cb-s1').value)&1, S0=(+document.getElementById('cb-s0').value)&1;
    const sel = S1*2+S0;
    const Y = D[sel];
    const Din = (+document.getElementById('cb-din').value)&1;
    const demuxOut = [0,0,0,0]; demuxOut[sel] = Din;
    document.getElementById('cb-mux-out').innerHTML =
      `MUX: select = <span class="eq" style="color:var(--accent)">${S1}${S0}</span> (line ${sel}) → Y = <span class="eq" style="color:var(--accent)">${Y}</span><br>` +
      `DEMUX: Din=${Din} routed to line ${sel} → Y0=${demuxOut[0]} Y1=${demuxOut[1]} Y2=${demuxOut[2]} Y3=${demuxOut[3]}`;
  }

  function calcEncDec() {
    const ins = [0,1,2,3,4,5,6,7].map(i=>(+document.getElementById('cb-enc'+i).value)&1);
    let highest = -1;
    ins.forEach((v,i) => { if (v) highest = i; });
    document.getElementById('cb-enc-out').innerHTML = highest===-1
      ? `No inputs active → output invalid`
      : `Highest active input: I${highest} → Encoded output = <span class="eq" style="color:var(--accent)">${highest.toString(2).padStart(3,'0')}</span> (binary ${highest})`;

    const decIn = (+document.getElementById('cb-dec-in').value) & 7;
    let html = '';
    for (let i=0;i<8;i++) {
      const active = i === decIn;
      html += `<div style="width:38px;height:38px;border-radius:6px;display:flex;align-items:center;justify-content:center;
        font-family:var(--mono);font-size:12px;font-weight:700;
        background:${active?'rgba(0,255,157,0.15)':'var(--s2)'};border:1px solid ${active?'var(--accent)':'var(--border)'};
        color:${active?'var(--accent)':'var(--muted)'}">O${i}</div>`;
    }
    document.getElementById('cb-dec-out').innerHTML = html;
  }

  function calcCompare() {
    const A=+document.getElementById('cb-cmpa').value, B=+document.getElementById('cb-cmpb').value;
    document.getElementById('cb-cmp-out').innerHTML =
      `A${A>B?' > ':A<B?' < ':' = '}B &nbsp;|&nbsp; A&gt;B=<span class="eq" style="color:var(--accent)">${A>B?1:0}</span> ` +
      `A=B=<span class="eq" style="color:var(--accent)">${A===B?1:0}</span> A&lt;B=<span class="eq" style="color:var(--accent)">${A<B?1:0}</span>`;
  }

  function calcParity() {
    const bits = document.getElementById('cb-par').value.replace(/[^01]/g,'');
    const type = document.getElementById('cb-par-type').value;
    const ones = bits.split('').filter(b=>b==='1').length;
    const parityBit = type==='even' ? (ones%2) : (ones%2===0?1:0);
    document.getElementById('cb-par-out').innerHTML =
      `Data: <span class="eq" style="color:var(--accent)">${bits}</span> (${ones} ones) &nbsp;|&nbsp; ` +
      `${type} parity bit = <span class="eq" style="color:var(--accent)">${parityBit}</span><br>` +
      `Transmitted codeword: <span class="eq" style="color:var(--accent)">${bits}${parityBit}</span>`;
  }

  async function explainAdder() {
    const aiEl = document.getElementById('cb-adder-ai'); aiEl.style.display='block';
    const type = document.getElementById('cb-adder-type').value;
    await askAI(`Explain the ${({ha:'half adder',fa:'full adder',hs:'half subtractor',fs:'full subtractor'})[type]} circuit to an ECE student. Cover: 1. The Boolean equations for its outputs 2. How it's built from basic gates (XOR/AND/OR) 3. How full adders chain together to build a ripple-carry adder. Be clear and concise.`, aiEl);
  }
  async function explainMux() {
    const aiEl = document.getElementById('cb-mux-ai'); aiEl.style.display='block';
    await askAI(`Explain multiplexers and demultiplexers to an ECE student using a 4:1 MUX / 1:4 DEMUX example. Cover: 1. How select lines choose which input/output path is active 2. Why MUX is often called a "data selector" 3. One practical application each (e.g., data routing, serial-to-parallel). Be clear and concise.`, aiEl);
  }
  async function explainEncDec() {
    const aiEl = document.getElementById('cb-encdec-ai'); aiEl.style.display='block';
    await askAI(`Explain priority encoders and decoders to an ECE student using an 8:3 encoder / 3:8 decoder example. Cover: 1. Why encoders need "priority" logic when multiple inputs are active 2. How a decoder activates exactly one output line from a binary input 3. One practical application each. Be clear and concise.`, aiEl);
  }
  async function explainCompare() {
    const aiEl = document.getElementById('cb-cmp-ai'); aiEl.style.display='block';
    await askAI(`Explain magnitude comparator circuits to an ECE student. Cover: 1. How A>B, A=B, A<B outputs are derived from the bits of A and B 2. How comparators cascade to compare wider numbers 3. One practical application. Be clear and concise.`, aiEl);
  }
  async function explainParity() {
    const aiEl = document.getElementById('cb-par-ai'); aiEl.style.display='block';
    await askAI(`Explain parity bit generation and checking to an ECE student. Cover: 1. How even vs odd parity bits are computed (XOR of all data bits) 2. Why parity can detect single-bit errors but not all errors 3. Where parity checking is used in practice. Be clear and concise.`, aiEl);
  }

  return { init, onShow, calcAdder, calcMux, calcEncDec, calcCompare, calcParity,
    explainAdder, explainMux, explainEncDec, explainCompare, explainParity };
})();

})();

        </div>
        <canvas id="digimodcanvas" style="margin-top:12px"></canvas>
        <div id="dm-out" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="DigiMod.explainMod()">✨ AI Explain</button>
        <div id="dm-mod-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>

      <div class="card">
        <h4>Constellation Diagram (BPSK / QPSK)</h4>
        <canvas id="constcanvas" style="margin-top:8px"></canvas>
        <div id="dm-const-out" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="DigiMod.explainConst()">✨ AI Explain</button>
        <div id="dm-const-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>
    `;
    dmCanvas = document.getElementById('digimodcanvas'); dmCtx = dmCanvas.getContext('2d');
    dmCanvas.width = dmCanvas.offsetWidth; dmCanvas.height = 220;
    coCanvas = document.getElementById('constcanvas'); coCtx = coCanvas.getContext('2d');
    coCanvas.width = coCanvas.offsetWidth; coCanvas.height = 220;
    draw(); drawConst();
  }

  function onShow() {
    if (dmCanvas) { dmCanvas.width = dmCanvas.offsetWidth; draw(); }
    if (coCanvas) { coCanvas.width = coCanvas.offsetWidth; drawConst(); }
  }

  function draw() {
    if (!dmCanvas || dmCanvas.width < 10) return;
    const scheme = document.getElementById('dm-scheme').value;
    const raw = document.getElementById('dm-bits').value.replace(/[^01]/g,'');
    const bits = raw.length ? raw.split('').map(Number) : [1,0,1,1];
    const W = dmCanvas.width, H = dmCanvas.height;
    dmCtx.clearRect(0,0,W,H);
    const rowH = H/2, ox = 10, pw = W-20;
    const n = scheme === 'qpsk' ? Math.ceil(bits.length/2) : bits.length;
    const bw = pw / n;
    const fc = 3; // cycles per bit period (baseline)

    // bit sequence row
    dmCtx.strokeStyle = 'rgba(255,255,255,0.1)'; dmCtx.lineWidth=1;
    dmCtx.beginPath(); dmCtx.moveTo(ox, rowH*0.5); dmCtx.lineTo(ox+pw, rowH*0.5); dmCtx.stroke();
    dmCtx.fillStyle='#6b6b80'; dmCtx.font='10px JetBrains Mono';
    dmCtx.fillText('Bits', 4, rowH*0.15);
    dmCtx.strokeStyle = '#3b82f6'; dmCtx.lineWidth = 2; dmCtx.beginPath();
    bits.forEach((b,i) => {
      const x0 = ox + i*(pw/bits.length), x1 = ox + (i+1)*(pw/bits.length), y = rowH*0.5 - (b?rowH*0.3:-rowH*0.3);
      i===0?dmCtx.moveTo(x0,y):dmCtx.lineTo(x0,y);
      dmCtx.lineTo(x1,y);
    });
    dmCtx.stroke();

    // modulated carrier row
    dmCtx.fillStyle='#6b6b80'; dmCtx.fillText('Modulated Carrier', 4, rowH*1.15);
    dmCtx.strokeStyle = '#00ff9d'; dmCtx.lineWidth = 1.8; dmCtx.beginPath();
    let first = true;
    for (let i = 0; i < pw; i++) {
      const tBit = i / bw;
      const idx = Math.min(Math.floor(tBit), n-1);
      const tLocal = (tBit - idx) * 2*Math.PI*fc;
      let val;
      if (scheme === 'ask') { val = bits[idx] ? Math.sin(tLocal) : 0.05*Math.sin(tLocal); }
      else if (scheme === 'fsk') { const f = bits[idx] ? fc*1.6 : fc*0.7; val = Math.sin((i/bw)*2*Math.PI*f); }
      else if (scheme === 'bpsk') { val = Math.sin(tLocal + (bits[idx] ? Math.PI : 0)); }
      else { // qpsk: pair bits into symbol -> phase
        const b0 = bits[idx*2] || 0, b1 = bits[idx*2+1] || 0;
        const phase = [Math.PI/4, 3*Math.PI/4, 5*Math.PI/4, 7*Math.PI/4][b0*2+b1];
        val = Math.sin(tLocal + phase);
      }
      const y = rowH*1.5 - val*rowH*0.4;
      first ? (dmCtx.moveTo(ox+i,y), first=false) : dmCtx.lineTo(ox+i,y);
    }
    dmCtx.stroke();

    // symbol boundary ticks
    dmCtx.strokeStyle = 'rgba(255,255,255,0.15)';
    for (let i=0;i<=n;i++) { const x = ox+i*bw; dmCtx.beginPath(); dmCtx.moveTo(x,4); dmCtx.lineTo(x,H-4); dmCtx.stroke(); }

    const label = {ask:'ASK',fsk:'FSK',bpsk:'BPSK',qpsk:'QPSK'}[scheme];
    document.getElementById('dm-out').innerHTML =
      `${label}: ${scheme==='qpsk' ? n+' symbols (2 bits/symbol)' : bits.length+' symbols (1 bit/symbol)'} &nbsp;|&nbsp; ` +
      `Bandwidth efficiency: <span class="eq" style="color:var(--accent)">${scheme==='qpsk'?'2× better than BPSK':'baseline'}</span>`;
  }

  function drawConst() {
    if (!coCanvas || coCanvas.width < 10) return;
    const W = coCanvas.width, H = coCanvas.height;
    coCtx.clearRect(0,0,W,H);
    const cx=W/2, cy=H/2, rad=Math.max(Math.min(W,H)/2-30,5);
    coCtx.strokeStyle='rgba(255,255,255,0.12)'; coCtx.lineWidth=1;
    coCtx.beginPath(); coCtx.moveTo(cx-rad,cy); coCtx.lineTo(cx+rad,cy); coCtx.stroke();
    coCtx.beginPath(); coCtx.moveTo(cx,cy-rad); coCtx.lineTo(cx,cy+rad); coCtx.stroke();
    coCtx.fillStyle='#6b6b80'; coCtx.font='10px JetBrains Mono';
    coCtx.fillText('I', cx+rad-10, cy-6); coCtx.fillText('Q', cx+6, cy-rad+12);

    // BPSK points (red), QPSK points (green)
    const bpsk = [0, Math.PI];
    const qpsk = [Math.PI/4, 3*Math.PI/4, 5*Math.PI/4, 7*Math.PI/4];
    bpsk.forEach((ph,i) => {
      const x = cx + Math.cos(ph)*rad*0.6, y = cy - Math.sin(ph)*rad*0.6;
      coCtx.fillStyle = '#3b82f6'; coCtx.beginPath(); coCtx.arc(x,y,6,0,2*Math.PI); coCtx.fill();
      coCtx.fillText('BPSK-'+i, x+8, y+4);
    });
    qpsk.forEach((ph,i) => {
      const x = cx + Math.cos(ph)*rad*0.95, y = cy - Math.sin(ph)*rad*0.95;
      coCtx.fillStyle = '#00ff9d'; coCtx.beginPath(); coCtx.arc(x,y,6,0,2*Math.PI); coCtx.fill();
      coCtx.fillText('QPSK-'+i, x+8, y+4);
    });
    document.getElementById('dm-const-out').innerHTML =
      `Blue = BPSK symbol points (2, 180° apart) &nbsp;|&nbsp; Green = QPSK symbol points (4, 90° apart) — ` +
      `each point's angle is the carrier phase, distance from origin is amplitude.`;
  }

  async function explainMod() {
    const aiEl = document.getElementById('dm-mod-ai'); aiEl.style.display='block';
    const scheme = document.getElementById('dm-scheme').value;
    await askAI(`Explain ${({ask:'ASK',fsk:'FSK',bpsk:'BPSK',qpsk:'QPSK'})[scheme]} digital modulation to an ECE student. Cover: 1. What property of the carrier changes to represent bits (amplitude/frequency/phase) 2. Bandwidth and noise-immunity tradeoffs vs the other schemes 3. One practical system that uses it. Be clear and concise.`, aiEl);
  }
  async function explainConst() {
    const aiEl = document.getElementById('dm-const-ai'); aiEl.style.display='block';
    await askAI(`Explain constellation diagrams for digital modulation to an ECE student. Cover: 1. What the I (in-phase) and Q (quadrature) axes represent 2. Why QPSK carries 2 bits per symbol vs BPSK's 1 bit per symbol 3. How constellation point spacing relates to noise immunity (why QAM with more points is more error-prone at the same power). Be clear and concise.`, aiEl);
  }

  return { init, onShow, draw, drawConst, explainMod, explainConst };
})();

/* ══════════════════════════════════════
   SAMPLING & PCM
══════════════════════════════════════ */
const PCMLab = (() => {
  let spCanvas, spCtx;

  function init() {
    const p = document.getElementById('panel-pcm');
    p.innerHTML = `
      <div class="sec">Sampling &amp; Pulse Code Modulation</div>

      <div class="card" style="margin-bottom:16px">
        <h4>Nyquist Sampling &amp; Aliasing</h4>
        <div class="row">
          <div class="col"><label>Signal Frequency (Hz)</label><input type="number" id="pcm-fsig" value="4" min="1" max="20" step="0.5" oninput="PCMLab.drawSample()"></div>
          <div class="col"><label>Sampling Frequency (Hz)</label><input type="number" id="pcm-fs" value="12" min="1" max="60" step="0.5" oninput="PCMLab.drawSample()"></div>
        </div>
        <canvas id="samplecanvas" style="margin-top:12px"></canvas>
        <div id="pcm-sample-out" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="PCMLab.explainSampling()">✨ AI Explain</button>
        <div id="pcm-sample-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>

      <div class="card">
        <h4>PCM Encoding</h4>
        <div class="row">
          <div class="col"><label>Resolution (bits)</label><input type="number" id="pcm-bits" value="3" min="1" max="8" step="1" oninput="PCMLab.encodePCM()"></div>
          <div class="col"><label>Samples to encode</label><input type="number" id="pcm-nsamp" value="8" min="4" max="16" step="1" oninput="PCMLab.encodePCM()"></div>
        </div>
        <div id="pcm-out" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:12px;line-height:2;word-break:break-all"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="PCMLab.explainPCM()">✨ AI Explain</button>
        <div id="pcm-pcm-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>
    `;
    spCanvas = document.getElementById('samplecanvas'); spCtx = spCanvas.getContext('2d');
    spCanvas.width = spCanvas.offsetWidth; spCanvas.height = 220;
    drawSample(); encodePCM();
  }

  function onShow() { if (spCanvas) { spCanvas.width = spCanvas.offsetWidth; drawSample(); } }

  function drawSample() {
    if (!spCanvas || spCanvas.width < 10) return;
    const fsig = +document.getElementById('pcm-fsig').value;
    const fs = +document.getElementById('pcm-fs').value;
    const W = spCanvas.width, H = spCanvas.height;
    spCtx.clearRect(0,0,W,H);
    const ox=10, pw=W-20, midY=H/2, amp=H*0.35, tMax=1;

    spCtx.strokeStyle='rgba(255,255,255,0.1)'; spCtx.lineWidth=1;
    spCtx.beginPath(); spCtx.moveTo(ox,midY); spCtx.lineTo(ox+pw,midY); spCtx.stroke();

    // continuous signal
    spCtx.strokeStyle='#3b82f6'; spCtx.lineWidth=1.5; spCtx.beginPath();
    for (let i=0;i<=pw;i++) { const t=(i/pw)*tMax; const y=midY-Math.sin(2*Math.PI*fsig*t)*amp; i===0?spCtx.moveTo(ox+i,y):spCtx.lineTo(ox+i,y); }
    spCtx.stroke();

    // sample points + stems
    const nSamples = Math.floor(fs*tMax);
    spCtx.strokeStyle='#00ff9d'; spCtx.fillStyle='#00ff9d';
    for (let k=0;k<=nSamples;k++) {
      const t = k/fs; if (t>tMax) break;
      const x = ox + (t/tMax)*pw;
      const y = midY - Math.sin(2*Math.PI*fsig*t)*amp;
      spCtx.beginPath(); spCtx.moveTo(x,midY); spCtx.lineTo(x,y); spCtx.stroke();
      spCtx.beginPath(); spCtx.arc(x,y,4,0,2*Math.PI); spCtx.fill();
    }

    const nyquist = 2*fsig;
    const aliased = fs < nyquist;
    document.getElementById('pcm-sample-out').innerHTML =
      `Nyquist rate = 2×fsignal = <span class="eq" style="color:var(--accent)">${nyquist} Hz</span> &nbsp;|&nbsp; ` +
      `Sampling at <span class="eq" style="color:var(--accent)">${fs} Hz</span> → ` +
      `${aliased ? '<span style="color:var(--red)">ALIASING — undersampled, signal cannot be reconstructed</span>' : '<span style="color:var(--accent)">OK — satisfies Nyquist criterion</span>'}`;
  }

  function encodePCM() {
    const bits = +document.getElementById('pcm-bits').value;
    const n = +document.getElementById('pcm-nsamp').value;
    const levels = Math.pow(2,bits);
    const samples = [];
    for (let i=0;i<n;i++) {
      const v = 0.5 + 0.5*Math.sin(2*Math.PI*i/n);
      samples.push(Math.min(Math.floor(v*levels), levels-1));
    }
    const codes = samples.map(s => s.toString(2).padStart(bits,'0'));
    document.getElementById('pcm-out').innerHTML =
      `Quantized levels: <span class="eq" style="color:var(--accent)">${samples.join(', ')}</span><br>` +
      `PCM bitstream (${bits} bits/sample): <span class="eq" style="color:var(--accent)">${codes.join(' ')}</span><br>` +
      `Bit rate = samples × bits/sample = <span class="eq" style="color:var(--accent)">${n*bits} bits</span> for this block`;
  }

  async function explainSampling() {
    const aiEl = document.getElementById('pcm-sample-ai'); aiEl.style.display='block';
    await askAI(`Explain the Nyquist sampling theorem and aliasing to an ECE student. Cover: 1. Why sampling rate must be at least 2× the signal's highest frequency 2. What aliasing looks like and why it happens when undersampled 3. How anti-aliasing filters are used in practice before sampling. Be clear and concise.`, aiEl);
  }
  async function explainPCM() {
    const aiEl = document.getElementById('pcm-pcm-ai'); aiEl.style.display='block';
    await askAI(`Explain Pulse Code Modulation (PCM) to an ECE student. Cover: 1. The three steps: sampling, quantization, encoding 2. Why more bits per sample means better quality but higher bit rate 3. One real system that uses PCM (e.g., telephone systems, CD audio). Be clear and concise.`, aiEl);
  }

  return { init, onShow, drawSample, encodePCM, explainSampling, explainPCM };
})();

/* ══════════════════════════════════════
   MULTIPLEXING — TDM / FDM
══════════════════════════════════════ */
const MuxComm = (() => {
  let tCanvas, tCtx, fCanvasM, fCtxM;

  function init() {
    const p = document.getElementById('panel-muxcomm');
    p.innerHTML = `
      <div class="sec">Multiplexing — TDM &amp; FDM</div>

      <div class="card" style="margin-bottom:16px">
        <h4>Time Division Multiplexing (TDM)</h4>
        <div class="row">
          <div class="col"><label>Number of Channels</label><input type="number" id="mx-nch" value="4" min="2" max="6" step="1" oninput="MuxComm.drawTDM()"></div>
          <div class="col"><label>Frame Repeats</label><input type="number" id="mx-frames" value="3" min="1" max="5" step="1" oninput="MuxComm.drawTDM()"></div>
        </div>
        <canvas id="tdmcanvas" style="margin-top:12px"></canvas>
        <div id="mx-tdm-out" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="MuxComm.explainTDM()">✨ AI Explain</button>
        <div id="mx-tdm-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>

      <div class="card">
        <h4>Frequency Division Multiplexing (FDM)</h4>
        <div class="row">
          <div class="col"><label>Number of Channels</label><input type="number" id="mx-fnch" value="4" min="2" max="6" step="1" oninput="MuxComm.drawFDM()"></div>
          <div class="col"><label>Channel Bandwidth (kHz)</label><input type="number" id="mx-bw" value="4" min="1" max="20" step="0.5" oninput="MuxComm.drawFDM()"></div>
          <div class="col"><label>Guard Band (kHz)</label><input type="number" id="mx-guard" value="1" min="0" max="5" step="0.5" oninput="MuxComm.drawFDM()"></div>
        </div>
        <canvas id="fdmcanvas" style="margin-top:12px"></canvas>
        <div id="mx-fdm-out" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="MuxComm.explainFDM()">✨ AI Explain</button>
        <div id="mx-fdm-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>
    `;
    tCanvas = document.getElementById('tdmcanvas'); tCtx = tCanvas.getContext('2d');
    tCanvas.width = tCanvas.offsetWidth; tCanvas.height = 180;
    fCanvasM = document.getElementById('fdmcanvas'); fCtxM = fCanvasM.getContext('2d');
    fCanvasM.width = fCanvasM.offsetWidth; fCanvasM.height = 200;
    drawTDM(); drawFDM();
  }

  function onShow() {
    if (tCanvas) { tCanvas.width = tCanvas.offsetWidth; drawTDM(); }
    if (fCanvasM) { fCanvasM.width = fCanvasM.offsetWidth; drawFDM(); }
  }

  const COLORS = ['#00ff9d','#3b82f6','#f59e0b','#a855f7','#ef4444','#22c55e'];

  function drawTDM() {
    if (!tCanvas || tCanvas.width < 10) return;
    const nch = +document.getElementById('mx-nch').value;
    const frames = +document.getElementById('mx-frames').value;
    const W = tCanvas.width, H = tCanvas.height;
    tCtx.clearRect(0,0,W,H);
    const ox=10, oy=30, pw=W-20, slotH=60;
    const totalSlots = nch*frames;
    const slotW = pw/totalSlots;
    for (let f=0; f<frames; f++) {
      for (let c=0; c<nch; c++) {
        const idx = f*nch+c;
        const x = ox + idx*slotW;
        tCtx.fillStyle = COLORS[c%COLORS.length];
        tCtx.globalAlpha = 0.75;
        tCtx.fillRect(x+1, oy, slotW-2, slotH);
        tCtx.globalAlpha = 1;
        tCtx.fillStyle = '#04140d'; tCtx.font='10px JetBrains Mono';
        tCtx.fillText('Ch'+(c+1), x+4, oy+slotH/2+4);
      }
    }
    tCtx.fillStyle='#6b6b80'; tCtx.font='10px JetBrains Mono';
    tCtx.fillText('time →', ox+pw-40, oy+slotH+20);
    document.getElementById('mx-tdm-out').innerHTML =
      `Each channel gets one time slot per frame, repeating every frame &nbsp;|&nbsp; ` +
      `${nch} channels × ${frames} frames = <span class="eq" style="color:var(--accent)">${totalSlots} slots shown</span>`;
  }

  function drawFDM() {
    if (!fCanvasM || fCanvasM.width < 10) return;
    const nch = +document.getElementById('mx-fnch').value;
    const bw = +document.getElementById('mx-bw').value;
    const guard = +document.getElementById('mx-guard').value;
    const W = fCanvasM.width, H = fCanvasM.height;
    fCtxM.clearRect(0,0,W,H);
    const ox=44, oy=H-26, pw=Math.max(W-60,10), ph=H-46;
    fCtxM.strokeStyle='rgba(255,255,255,0.12)'; fCtxM.lineWidth=1;
    fCtxM.beginPath(); fCtxM.moveTo(ox,oy); fCtxM.lineTo(ox+pw,oy); fCtxM.stroke();
    fCtxM.fillStyle='#6b6b80'; fCtxM.font='10px JetBrains Mono'; fCtxM.fillText('frequency →', ox+pw-60, oy+18);

    const totalBW = nch*bw + (nch-1)*guard;
    const scale = pw/totalBW;
    let cursor = 0;
    for (let c=0;c<nch;c++) {
      const x0 = ox+cursor*scale, w = bw*scale;
      fCtxM.fillStyle = COLORS[c%COLORS.length]; fCtxM.globalAlpha=0.7;
      // simple raised-bump shape for each channel band
      fCtxM.beginPath();
      fCtxM.moveTo(x0, oy);
      fCtxM.quadraticCurveTo(x0+w/2, oy-ph, x0+w, oy);
      fCtxM.closePath(); fCtxM.fill();
      fCtxM.globalAlpha=1;
      fCtxM.fillStyle='#04140d'; fCtxM.font='10px JetBrains Mono';
      fCtxM.fillText('Ch'+(c+1), x0+w/2-10, oy-ph*0.4);
      cursor += bw + guard;
    }
    document.getElementById('mx-fdm-out').innerHTML =
      `Each channel occupies its own frequency band, separated by guard bands to avoid overlap &nbsp;|&nbsp; ` +
      `Total bandwidth used ≈ <span class="eq" style="color:var(--accent)">${totalBW.toFixed(1)} kHz</span>`;
  }

  async function explainTDM() {
    const aiEl = document.getElementById('mx-tdm-ai'); aiEl.style.display='block';
    await askAI(`Explain Time Division Multiplexing (TDM) to an ECE student. Cover: 1. How multiple channels share one transmission line by taking turns in time slots 2. Difference between synchronous and statistical TDM (briefly) 3. One real-world use case (e.g., telephone trunk lines). Be clear and concise.`, aiEl);
  }
  async function explainFDM() {
    const aiEl = document.getElementById('mx-fdm-ai'); aiEl.style.display='block';
    await askAI(`Explain Frequency Division Multiplexing (FDM) to an ECE student. Cover: 1. How multiple channels share one medium by occupying separate frequency bands simultaneously 2. Why guard bands are needed between channels 3. One real-world use case (e.g., FM radio broadcasting, cable TV). Be clear and concise.`, aiEl);
  }

  return { init, onShow, drawTDM, drawFDM, explainTDM, explainFDM };
})();

/* ══════════════════════════════════════
   NOISE & SNR
══════════════════════════════════════ */
const NoiseLab = (() => {
  let noiseCanvas, noiseCtx;

  // simple seeded pseudo-random so the waveform doesn't jump wildly on every redraw
  let seed = 42;
  function rand() { seed = (seed*1103515245+12345) & 0x7fffffff; return (seed/0x7fffffff)*2-1; }

  function init() {
    const p = document.getElementById('panel-noise');
    p.innerHTML = `
      <div class="sec">Noise &amp; Signal-to-Noise Ratio</div>

      <div class="card">
        <div class="row">
          <div class="col"><label>Signal Power (mW)</label><input type="number" id="nz-psig" value="10" min="0.001" max="1000" step="0.1" oninput="NoiseLab.calc()"></div>
          <div class="col"><label>Noise Power (mW)</label><input type="number" id="nz-pnoise" value="0.1" min="0.0001" max="1000" step="0.01" oninput="NoiseLab.calc()"></div>
        </div>
        <canvas id="noisecanvas" style="margin-top:12px"></canvas>
        <div id="nz-out" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px;line-height:1.8"></div>
        <button class="btn btn-p" style="margin-top:10px" onclick="NoiseLab.explain()">✨ AI Explain</button>
        <div id="nz-ai" class="card" style="display:none;font-size:12px;line-height:1.9;margin-top:10px"></div>
      </div>
    `;
    noiseCanvas = document.getElementById('noisecanvas'); noiseCtx = noiseCanvas.getContext('2d');
    noiseCanvas.width = noiseCanvas.offsetWidth; noiseCanvas.height = 220;
    calc();
  }

  function onShow() { if (noiseCanvas) { noiseCanvas.width = noiseCanvas.offsetWidth; calc(); } }

  function calc() {
    const Ps = +document.getElementById('nz-psig').value;
    const Pn = +document.getElementById('nz-pnoise').value;
    const snrLin = Ps/Pn;
    const snrDb = 10*Math.log10(snrLin);

    if (noiseCanvas && noiseCanvas.width >= 10) {
      const W = noiseCanvas.width, H = noiseCanvas.height;
      noiseCtx.clearRect(0,0,W,H);
      const ox=10, pw=W-20, midY=H/2, amp=H*0.32;
      noiseCtx.strokeStyle='rgba(255,255,255,0.1)'; noiseCtx.lineWidth=1;
      noiseCtx.beginPath(); noiseCtx.moveTo(ox,midY); noiseCtx.lineTo(ox+pw,midY); noiseCtx.stroke();

      const noiseAmp = Math.min(Math.sqrt(Pn/Ps), 3) * amp * 0.5;
      seed = 42;
      noiseCtx.strokeStyle='#00ff9d'; noiseCtx.lineWidth=1.5; noiseCtx.beginPath();
      for (let i=0;i<=pw;i++) {
        const t = i/pw*4*Math.PI;
        const v = Math.sin(t)*amp*0.7 + rand()*noiseAmp;
        const y = midY - v;
        i===0?noiseCtx.moveTo(ox+i,y):noiseCtx.lineTo(ox+i,y);
      }
      noiseCtx.stroke();
    }

    document.getElementById('nz-out').innerHTML =
      `SNR = Ps/Pn = <span class="eq" style="color:var(--accent)">${snrLin.toFixed(2)}</span> (linear) &nbsp;|&nbsp; ` +
      `SNR = <span class="eq" style="color:var(--accent)">${snrDb.toFixed(2)} dB</span><br>` +
      `${snrDb > 20 ? 'High SNR — clean signal' : snrDb > 0 ? 'Moderate SNR — noise visibly affects the waveform' : 'SNR below 0 dB — noise power exceeds signal power'}`;
  }

  async function explain() {
    const aiEl = document.getElementById('nz-ai'); aiEl.style.display='block';
    await askAI(`Explain Signal-to-Noise Ratio (SNR) in communication systems to an ECE student. Cover: 1. Why SNR is expressed in dB (10·log10(Ps/Pn)) 2. How SNR affects bit error rate in digital communication and clarity in analog communication 3. What "noise floor" means and where noise typically comes from (thermal noise, etc). Be clear and concise.`, aiEl);
  }

  return { init, onShow, calc, explain };
})();

const AmpConfig = (() => {

    cc: {name:'Common Collector (CC) / Emitter Follower', zin:'High (10 kΩ-1 MΩ)', zout:'Low (10-100 Ω)', av:'≈1 (slightly &lt;1)', ai:'High (β)', phase:'0° (in phase)', use:'Impedance buffer / driving low-impedance loads'},
  };

  function init() {
    const p = document.getElementById('panel-ampconfig');
    p.innerHTML = `
      <div class="sec">Amplifier Configurations &amp; Frequency Response</div>

      <div class="card" style="margin-bottom:16px">
        <h4>CE / CB / CC Comparison</h4>
        <div class="row">
          <div class="col">
            <label>Configuration</label>
            <select id="ac-cfg" onchange="AmpConfig.showConfig()">
